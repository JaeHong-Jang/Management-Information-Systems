\u003c/td>\n\u003ctd>설문·회귀분석\u003c/td>\n\u003ctd>I01 I03 I07\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#papers/P25.md\">P25\u003c/a>\u003c/td>\n\u003ctd>의료서비스 실패 유형에 따른 서비스 회복 공정성이 고객 만족 및 장기 관계 지향성에 미치는 영향: 다중집단분석을 활용하여\u003c/td>\n\u003ctd style=\"text-align:right\">2017\u003c/td>\n\u003ctd>실증 연구\u003c/td>\n\u003ctd>I05\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n"}, {"id": "papers/P01.md", "title": "P01 · A Dynamic Theory of Organizational Knowledge Creation", "text": "# P01 · A Dynamic Theory of Organizational Knowledge Creation\n\n[위키 홈](../README.md) · [논문 목록](../literature.md)\n\n| 항목 | 내용 |\n|---|---|\n| 저자 | Ikujiro Nonaka |\n| 발행연도 | 1994 |\n| 학술지·공개처 | Organization Science 5(1), 14–37 |\n| DOI | 10.1287/orsc.5.1.14 |\n| 연구 방식 | 이론 |\n| 실제 확인 범위 | 출판사 초록 |\n| 확인일 | 2026-10-31 |\n\n## 확인한 내용\n\n암묵지와 형식지의 상호작용을 통해 조직 지식이 만들어지는 과정을 설명한다. [출처 확인](https://pubsonline.informs.org/doi/abs/10.1287/orsc.5.1.14)\n\n## 아이디어에 적용할 점 — 조사자의 해석\n\n현장 직원의 예외 처리 이유를 기록하고 다른 직원이 재사용하는 구조의 이론적 근거.\n\n## 한계와 원문 확인 사항\n\n이론 논문이며 AI 서비스의 효과를 실증한 연구가 아니다. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\n\n## 연결된 아이디어\n\n[I02](../ideas/I02.md) · [I04](../ideas/I04.md)\n", "html": "\u003ch1>P01 · A Dynamic Theory of Organizational Knowledge Creation\u003c/h1>\n\u003cp>\u003ca href=\"#README.md\">위키 홈\u003c/a> · \u003ca href=\"#literature.md\">논문 목록\u003c/a>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>항목\u003c/th>\n\u003cth>내용\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>저자\u003c/td>\n\u003ctd>Ikujiro Nonaka\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>발행연도\u003c/td>\n\u003ctd>1994\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>학술지·공개처\u003c/td>\n\u003ctd>Organization Science 5(1), 14–37\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DOI\u003c/td>\n\u003ctd>10.1287/orsc.5.1.14\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>연구 방식\u003c/td>\n\u003ctd>이론\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>실제 확인 범위\u003c/td>\n\u003ctd>출판사 초록\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>확인일\u003c/td>\n\u003ctd>2026-10-31\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>확인한 내용\u003c/h2>\n\u003cp>암묵지와 형식지의 상호작용을 통해 조직 지식이 만들어지는 과정을 설명한다. \u003ca href=\"https://pubsonline.informs.org/doi/abs/10.1287/orsc.5.1.14\">출처 확인\u003c/a>\u003c/p>\n\u003ch2>아이디어에 적용할 점 — 조사자의 해석\u003c/h2>\n\u003cp>현장 직원의 예외 처리 이유를 기록하고 다른 직원이 재사용하는 구조의 이론적 근거.\u003c/p>\n\u003ch2>한계와 원문 확인 사항\u003c/h2>\n\u003cp>이론 논문이며 AI 서비스의 효과를 실증한 연구가 아니다. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\u003c/p>\n\u003ch2>연결된 아이디어\u003c/h2>\n\u003cp>\u003ca href=\"#ideas/I02.md\">I02\u003c/a> · \u003ca href=\"#ideas/I04.md\">I04\u003c/a>\u003c/p>\n"}, {"id": "papers/P02.md", "title": "P02 · Review: Knowledge Management and Knowledge Management Systems: Conceptual Foundations and Research Issues", "text": "# P02 · Review: Knowledge Management and Knowledge Management Systems: Conceptual Foundations and Research Issues\n\n[위키 홈](../README.md) · [논문 목록](../literature.md)\n\n| 항목 | 내용 |\n|---|---|\n| 저자 | Maryam Alavi; Dorothy E. Leidner |\n| 발행연도 | 2001 |\n| 학술지·공개처 | MIS Quarterly 25(1), 107–136 |\n| DOI | 10.2307/3250961 |\n| 연구 방식 | 문헌 검토 |\n| 실제 확인 범위 | 공개 원문 검색 발췌·서지 |\n| 확인일 | 2026-10-31 |\n\n## 확인한 내용\n\n지식경영과 이를 지원하는 정보시스템의 개념 및 연구 이슈를 정리한다. [출처 확인](https://www.cs.unibo.it/gaspari/www/teaching/14_KM_KMsystems_Alavi_MISQ.pdf)\n\n## 아이디어에 적용할 점 — 조사자의 해석\n\n고객 정보를 저장하는 단계와 실제 업무에 지식을 적용하는 단계를 구분하는 설계 틀.\n\n## 한계와 원문 확인 사항\n\n원문 전체를 정독하지 않았으며 최신 LLM에 대한 성능 근거는 아니다. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\n\n## 연결된 아이디어\n\n[I01](../ideas/I01.md) · [I02](../ideas/I02.md) · [I04](../ideas/I04.md)\n", "html": "\u003ch1>P02 · Review: Knowledge Management and Knowledge Management Systems: Conceptual Foundations and Research Issues\u003c/h1>\n\u003cp>\u003ca href=\"#README.md\">위키 홈\u003c/a> · \u003ca href=\"#literature.md\">논문 목록\u003c/a>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>항목\u003c/th>\n\u003cth>내용\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>저자\u003c/td>\n\u003ctd>Maryam Alavi; Dorothy E. Leidner\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>발행연도\u003c/td>\n\u003ctd>2001\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>학술지·공개처\u003c/td>\n\u003ctd>MIS Quarterly 25(1), 107–136\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DOI\u003c/td>\n\u003ctd>10.2307/3250961\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>연구 방식\u003c/td>\n\u003ctd>문헌 검토\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>실제 확인 범위\u003c/td>\n\u003ctd>공개 원문 검색 발췌·서지\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>확인일\u003c/td>\n\u003ctd>2026-10-31\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>확인한 내용\u003c/h2>\n\u003cp>지식경영과 이를 지원하는 정보시스템의 개념 및 연구 이슈를 정리한다. \u003ca href=\"https://www.cs.unibo.it/gaspari/www/teaching/14_KM_KMsystems_Alavi_MISQ.pdf\">출처 확인\u003c/a>\u003c/p>\n\u003ch2>아이디어에 적용할 점 — 조사자의 해석\u003c/h2>\n\u003cp>고객 정보를 저장하는 단계와 실제 업무에 지식을 적용하는 단계를 구분하는 설계 틀.\u003c/p>\n\u003ch2>한계와 원문 확인 사항\u003c/h2>\n\u003cp>원문 전체를 정독하지 않았으며 최신 LLM에 대한 성능 근거는 아니다. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\u003c/p>\n\u003ch2>연결된 아이디어\u003c/h2>\n\u003cp>\u003ca href=\"#ideas/I01.md\">I01\u003c/a> · \u003ca href=\"#ideas/I02.md\">I02\u003c/a> · \u003ca href=\"#ideas/I04.md\">I04\u003c/a>\u003c/p>\n"}, {"id": "papers/P03.md", "title": "P03 · Five Styles of Customer Knowledge Management, and How Smart Companies Use Them To Create Value", "text": "# P03 · Five Styles of Customer Knowledge Management, and How Smart Companies Use Them To Create Value\n\n[위키 홈](../README.md) · [논문 목록](../literature.md)\n\n| 항목 | 내용 |\n|---|---|\n| 저자 | Michael Gibbert; Marius Leibold; Gilbert Probst |\n| 발행연도 | 2002 |\n| 학술지·공개처 | European Management Journal 20(5), 459–469 |\n| DOI | 이번 조사에서 미기입 |\n| 연구 방식 | 개념·사례 |\n| 실제 확인 범위 | 저자 소속기관 서지 및 공개 초록 |\n| 확인일 | 2026-10-31 |\n\n## 확인한 내용\n\n고객을 정보의 대상뿐 아니라 지식을 가진 참여자로 보는 고객지식경영을 제안한다. [출처 확인](https://search.usi.ch/index.php/publications/5067/five-styles-of-customer-knowledge-management-and-how-smart-companies-use-them-to-create-value)\n\n## 아이디어에 적용할 점 — 조사자의 해석\n\n고객이 직접 인계 정보를 수정하거나 해결 경험을 남기는 설계의 출발점.\n\n## 한계와 원문 확인 사항\n\n개념·사례 근거이며 고객 참여 기능의 인과적 효과는 별도 검증해야 한다. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\n\n## 연결된 아이디어\n\n[I01](../ideas/I01.md) · [I04](../ideas/I04.md) · [I07](../ideas/I07.md)\n", "html": "\u003ch1>P03 · Five Styles of Customer Knowledge Management, and How Smart Companies Use Them To Create Value\u003c/h1>\n\u003cp>\u003ca href=\"#README.md\">위키 홈\u003c/a> · \u003ca href=\"#literature.md\">논문 목록\u003c/a>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>항목\u003c/th>\n\u003cth>내용\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>저자\u003c/td>\n\u003ctd>Michael Gibbert; Marius Leibold; Gilbert Probst\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>발행연도\u003c/td>\n\u003ctd>2002\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>학술지·공개처\u003c/td>\n\u003ctd>European Management Journal 20(5), 459–469\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DOI\u003c/td>\n\u003ctd>이번 조사에서 미기입\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>연구 방식\u003c/td>\n\u003ctd>개념·사례\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>실제 확인 범위\u003c/td>\n\u003ctd>저자 소속기관 서지 및 공개 초록\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>확인일\u003c/td>\n\u003ctd>2026-10-31\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>확인한 내용\u003c/h2>\n\u003cp>고객을 정보의 대상뿐 아니라 지식을 가진 참여자로 보는 고객지식경영을 제안한다. \u003ca href=\"https://search.usi.ch/index.php/publications/5067/five-styles-of-customer-knowledge-management-and-how-smart-companies-use-them-to-create-value\">출처 확인\u003c/a>\u003c/p>\n\u003ch2>아이디어에 적용할 점 — 조사자의 해석\u003c/h2>\n\u003cp>고객이 직접 인계 정보를 수정하거나 해결 경험을 남기는 설계의 출발점.\u003c/p>\n\u003ch2>한계와 원문 확인 사항\u003c/h2>\n\u003cp>개념·사례 근거이며 고객 참여 기능의 인과적 효과는 별도 검증해야 한다. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\u003c/p>\n\u003ch2>연결된 아이디어\u003c/h2>\n\u003cp>\u003ca href=\"#ideas/I01.md\">I01\u003c/a> · \u003ca href=\"#ideas/I04.md\">I04\u003c/a> · \u003ca href=\"#ideas/I07.md\">I07\u003c/a>\u003c/p>\n"}, {"id": "papers/P04.md", "title": "P04 · Understanding Customer Experience Throughout the Customer Journey", "text": "# P04 · Understanding Customer Experience Throughout the Customer Journey\n\n[위키 홈](../README.md) · [논문 목록](../literature.md)\n\n| 항목 | 내용 |\n|---|---|\n| 저자 | Katherine N. Lemon; Peter C. Verhoef |\n| 발행연도 | 2016 |\n| 학술지·공개처 | Journal of Marketing 80(6) |\n| DOI | 10.1509/jm.15.0420 |\n| 연구 방식 | 문헌 검토 |\n| 실제 확인 범위 | 출판사 초록·기관 공개 원문 발췌 |\n| 확인일 | 2026-10-31 |\n\n## 확인한 내용\n\n고객 경험을 여러 채널과 접점이 연결된 시간적 여정으로 다룬다. [출처 확인](https://doi.org/10.1509/jm.15.0420)\n\n## 아이디어에 적용할 점 — 조사자의 해석\n\n접점 하나의 응답 속도뿐 아니라 문의부터 해결까지의 전체 노력을 측정.\n\n## 한계와 원문 확인 사항\n\n고객 여정 이론은 특정 인계 기능의 효과 크기를 보장하지 않는다. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\n\n## 연결된 아이디어\n\n[I01](../ideas/I01.md) · [I03](../ideas/I03.md) · [I05](../ideas/I05.md) · [I06](../ideas/I06.md)\n", "html": "\u003ch1>P04 · Understanding Customer Experience Throughout the Customer Journey\u003c/h1>\n\u003cp>\u003ca href=\"#README.md\">위키 홈\u003c/a> · \u003ca href=\"#literature.md\">논문 목록\u003c/a>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>항목\u003c/th>\n\u003cth>내용\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>저자\u003c/td>\n\u003ctd>Katherine N. Lemon; Peter C. Verhoef\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>발행연도\u003c/td>\n\u003ctd>2016\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>학술지·공개처\u003c/td>\n\u003ctd>Journal of Marketing 80(6)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DOI\u003c/td>\n\u003ctd>10.1509/jm.15.0420\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>연구 방식\u003c/td>\n\u003ctd>문헌 검토\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>실제 확인 범위\u003c/td>\n\u003ctd>출판사 초록·기관 공개 원문 발췌\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>확인일\u003c/td>\n\u003ctd>2026-10-31\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>확인한 내용\u003c/h2>\n\u003cp>고객 경험을 여러 채널과 접점이 연결된 시간적 여정으로 다룬다. \u003ca href=\"https://doi.org/10.1509/jm.15.0420\">출처 확인\u003c/a>\u003c/p>\n\u003ch2>아이디어에 적용할 점 — 조사자의 해석\u003c/h2>\n\u003cp>접점 하나의 응답 속도뿐 아니라 문의부터 해결까지의 전체 노력을 측정.\u003c/p>\n\u003ch2>한계와 원문 확인 사항\u003c/h2>\n\u003cp>고객 여정 이론은 특정 인계 기능의 효과 크기를 보장하지 않는다. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\u003c/p>\n\u003ch2>연결된 아이디어\u003c/h2>\n\u003cp>\u003ca href=\"#ideas/I01.md\">I01\u003c/a> · \u003ca href=\"#ideas/I03.md\">I03\u003c/a> · \u003ca href=\"#ideas/I05.md\">I05\u003c/a> · \u003ca href=\"#ideas/I06.md\">I06\u003c/a>\u003c/p>\n"}, {"id": "papers/P05.md", "title": "P05 · Service Blueprinting: A Practical Technique for Service Innovation", "text": "# P05 · Service Blueprinting: A Practical Technique for Service Innovation\n\n[위키 홈](../README.md) · [논문 목록](../literature.md)\n\n| 항목 | 내용 |\n|---|---|\n| 저자 | Mary Jo Bitner; Amy L. Ostrom; Felicia N. Morgan |\n| 발행연도 | 2008 |\n| 학술지·공개처 | California Management Review 50(3), 66–94 |\n| DOI | 10.2307/41166446 |\n| 연구 방식 | 방법·사례 |\n| 실제 확인 범위 | 저자 소속기관 연구 소개 |\n| 확인일 | 2026-10-31 |\n\n## 확인한 내용\n\n고객 경험, 직원 활동, 내부 지원 프로세스의 연결을 시각화하는 서비스 블루프린트를 제시한다. [출처 확인](https://csl.wpcarey.asu.edu/service-blueprinting-a-practical-technique-for-service-innovation)\n\n## 아이디어에 적용할 점 — 조사자의 해석\n\n고객 화면과 담당자·지식 관리자 업무를 한 장에 연결해 설계.\n\n## 한계와 원문 확인 사항\n\n방법론의 유용성과 제안 서비스의 실제 성과는 구별해야 한다. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\n\n## 연결된 아이디어\n\n[I01](../ideas/I01.md) · [I02](../ideas/I02.md) · [I03](../ideas/I03.md) · [I05](../ideas/I05.md)\n", "html": "\u003ch1>P05 · Service Blueprinting: A Practical Technique for Service Innovation\u003c/h1>\n\u003cp>\u003ca href=\"#README.md\">위키 홈\u003c/a> · \u003ca href=\"#literature.md\">논문 목록\u003c/a>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>항목\u003c/th>\n\u003cth>내용\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>저자\u003c/td>\n\u003ctd>Mary Jo Bitner; Amy L. Ostrom; Felicia N. Morgan\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>발행연도\u003c/td>\n\u003ctd>2008\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>학술지·공개처\u003c/td>\n\u003ctd>California Management Review 50(3), 66–94\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DOI\u003c/td>\n\u003ctd>10.2307/41166446\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>연구 방식\u003c/td>\n\u003ctd>방법·사례\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>실제 확인 범위\u003c/td>\n\u003ctd>저자 소속기관 연구 소개\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>확인일\u003c/td>\n\u003ctd>2026-10-31\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>확인한 내용\u003c/h2>\n\u003cp>고객 경험, 직원 활동, 내부 지원 프로세스의 연결을 시각화하는 서비스 블루프린트를 제시한다. \u003ca href=\"https://csl.wpcarey.asu.edu/service-blueprinting-a-practical-technique-for-service-innovation\">출처 확인\u003c/a>\u003c/p>\n\u003ch2>아이디어에 적용할 점 — 조사자의 해석\u003c/h2>\n\u003cp>고객 화면과 담당자·지식 관리자 업무를 한 장에 연결해 설계.\u003c/p>\n\u003ch2>한계와 원문 확인 사항\u003c/h2>\n\u003cp>방법론의 유용성과 제안 서비스의 실제 성과는 구별해야 한다. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\u003c/p>\n\u003ch2>연결된 아이디어\u003c/h2>\n\u003cp>\u003ca href=\"#ideas/I01.md\">I01\u003c/a> · \u003ca href=\"#ideas/I02.md\">I02\u003c/a> · \u003ca href=\"#ideas/I03.md\">I03\u003c/a> · \u003ca href=\"#ideas/I05.md\">I05\u003c/a>\u003c/p>\n"}, {"id": "papers/P06.md", "title": "P06 · Customer Evaluations of Service Complaint Experiences: Implications for Relationship Marketing", "text": "# P06 · Customer Evaluations of Service Complaint Experiences: Implications for Relationship Marketing\n\n[위키 홈](../README.md) · [논문 목록](../literature.md)\n\n| 항목 | 내용 |\n|---|---|\n| 저자 | Stephen S. Tax; Stephen W. Brown; Murali Chandrashekaran |\n| 발행연도 | 1998 |\n| 학술지·공개처 | Journal of Marketing 62(2) |\n| DOI | 10.1177/002224299806200205 |\n| 연구 방식 | 실증 |\n| 실제 확인 범위 | 출판사 초록 |\n| 확인일 | 2026-10-31 |\n\n## 확인한 내용\n\n불만 처리를 결과·절차·대인적 대우의 공정성으로 평가하며 처리 만족과 신뢰·몰입의 관계를 다룬다. [출처 확인](https://doi.org/10.1177/002224299806200205)\n\n## 아이디어에 적용할 점 — 조사자의 해석\n\n보상 금액 외에 설명, 선택권, 처리 절차의 일관성을 평가 지표에 포함.\n\n## 한계와 원문 확인 사항\n\n오래된 일반 서비스 연구로 생성형 AI의 효과를 직접 검증하지 않았다. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\n\n## 연결된 아이디어\n\n[I01](../ideas/I01.md) · [I04](../ideas/I04.md) · [I05](../ideas/I05.md)\n", "html": "\u003ch1>P06 · Customer Evaluations of Service Complaint Experiences: Implications for Relationship Marketing\u003c/h1>\n\u003cp>\u003ca href=\"#README.md\">위키 홈\u003c/a> · \u003ca href=\"#literature.md\">논문 목록\u003c/a>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>항목\u003c/th>\n\u003cth>내용\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>저자\u003c/td>\n\u003ctd>Stephen S. Tax; Stephen W. Brown; Murali Chandrashekaran\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>발행연도\u003c/td>\n\u003ctd>1998\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>학술지·공개처\u003c/td>\n\u003ctd>Journal of Marketing 62(2)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DOI\u003c/td>\n\u003ctd>10.1177/002224299806200205\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>연구 방식\u003c/td>\n\u003ctd>실증\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>실제 확인 범위\u003c/td>\n\u003ctd>출판사 초록\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>확인일\u003c/td>\n\u003ctd>2026-10-31\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>확인한 내용\u003c/h2>\n\u003cp>불만 처리를 결과·절차·대인적 대우의 공정성으로 평가하며 처리 만족과 신뢰·몰입의 관계를 다룬다. \u003ca href=\"https://doi.org/10.1177/002224299806200205\">출처 확인\u003c/a>\u003c/p>\n\u003ch2>아이디어에 적용할 점 — 조사자의 해석\u003c/h2>\n\u003cp>보상 금액 외에 설명, 선택권, 처리 절차의 일관성을 평가 지표에 포함.\u003c/p>\n\u003ch2>한계와 원문 확인 사항\u003c/h2>\n\u003cp>오래된 일반 서비스 연구로 생성형 AI의 효과를 직접 검증하지 않았다. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\u003c/p>\n\u003ch2>연결된 아이디어\u003c/h2>\n\u003cp>\u003ca href=\"#ideas/I01.md\">I01\u003c/a> · \u003ca href=\"#ideas/I04.md\">I04\u003c/a> · \u003ca href=\"#ideas/I05.md\">I05\u003c/a>\u003c/p>\n"}, {"id": "papers/P07.md", "title": "P07 · Generative AI at Work", "text": "# P07 · Generative AI at Work\n\n[위키 홈](../README.md) · [논문 목록](../literature.md)\n\n| 항목 | 내용 |\n|---|---|\n| 저자 | Erik Brynjolfsson; Danielle Li; Lindsey Raymond |\n| 발행연도 | 2025 |\n| 학술지·공개처 | The Quarterly Journal of Economics 140(2), 889–942 |\n| DOI | 10.1093/qje/qjae044 |\n| 연구 방식 | 현장 도입 분석 |\n| 실제 확인 범위 | 출판사 초록·공개 본문 일부 |\n| 확인일 | 2026-10-31 |\n\n## 확인한 내용\n\n고객지원 직원 5,172명의 단계적 도입 자료에서 시간당 해결 건수가 평균 15% 증가했다. 경험·숙련도에 따라 효과가 달랐다. [출처 확인](https://doi.org/10.1093/qje/qjae044)\n\n## 아이디어에 적용할 점 — 조사자의 해석\n\n숙련자의 지식을 초보 직원에게 전달하는 지원 도구를 우선 검증할 이유.\n\n## 한계와 원문 확인 사항\n\n단일 조직 맥락의 결과를 국내 소상공인이나 완전 자동 상담 성과로 일반화할 수 없다. 구판의 14% 수치와 혼용 금지. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\n\n## 연결된 아이디어\n\n[I01](../ideas/I01.md) · [I02](../ideas/I02.md)\n", "html": "\u003ch1>P07 · Generative AI at Work\u003c/h1>\n\u003cp>\u003ca href=\"#README.md\">위키 홈\u003c/a> · \u003ca href=\"#literature.md\">논문 목록\u003c/a>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>항목\u003c/th>\n\u003cth>내용\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>저자\u003c/td>\n\u003ctd>Erik Brynjolfsson; Danielle Li; Lindsey Raymond\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>발행연도\u003c/td>\n\u003ctd>2025\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>학술지·공개처\u003c/td>\n\u003ctd>The Quarterly Journal of Economics 140(2), 889–942\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DOI\u003c/td>\n\u003ctd>10.1093/qje/qjae044\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>연구 방식\u003c/td>\n\u003ctd>현장 도입 분석\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>실제 확인 범위\u003c/td>\n\u003ctd>출판사 초록·공개 본문 일부\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>확인일\u003c/td>\n\u003ctd>2026-10-31\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>확인한 내용\u003c/h2>\n\u003cp>고객지원 직원 5,172명의 단계적 도입 자료에서 시간당 해결 건수가 평균 15% 증가했다. 경험·숙련도에 따라 효과가 달랐다. \u003ca href=\"https://doi.org/10.1093/qje/qjae044\">출처 확인\u003c/a>\u003c/p>\n\u003ch2>아이디어에 적용할 점 — 조사자의 해석\u003c/h2>\n\u003cp>숙련자의 지식을 초보 직원에게 전달하는 지원 도구를 우선 검증할 이유.\u003c/p>\n\u003ch2>한계와 원문 확인 사항\u003c/h2>\n\u003cp>단일 조직 맥락의 결과를 국내 소상공인이나 완전 자동 상담 성과로 일반화할 수 없다. 구판의 14% 수치와 혼용 금지. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\u003c/p>\n\u003ch2>연결된 아이디어\u003c/h2>\n\u003cp>\u003ca href=\"#ideas/I01.md\">I01\u003c/a> · \u003ca href=\"#ideas/I02.md\">I02\u003c/a>\u003c/p>\n"}, {"id": "papers/P08.md", "title": "P08 · Experimental evidence on the productivity effects of generative artificial intelligence", "text": "# P08 · Experimental evidence on the productivity effects of generative artificial intelligence\n\n[위키 홈](../README.md) · [논문 목록](../literature.md)\n\n| 항목 | 내용 |\n|---|---|\n| 저자 | Shakked Noy; Whitney Zhang |\n| 발행연도 | 2023 |\n| 학술지·공개처 | Science 381(6654), 187–192 |\n| DOI | 10.1126/science.adh2586 |\n| 연구 방식 | 무작위 실험 |\n| 실제 확인 범위 | 출판사·PubMed 초록 |\n| 확인일 | 2026-10-31 |\n\n## 확인한 내용\n\n전문직 453명의 글쓰기 실험에서 AI 제공 집단은 평균 소요 시간이 40% 줄고 산출물 품질은 18% 높았다. [출처 확인](https://doi.org/10.1126/science.adh2586)\n\n## 아이디어에 적용할 점 — 조사자의 해석\n\n답변 초안·업무 기록 작성 시간을 측정할 근거.\n\n## 한계와 원문 확인 사항\n\n글쓰기 실험이므로 고객 만족, 실제 문제 해결, 장기 학습 성과로 바꾸어 인용하면 안 된다. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\n\n## 연결된 아이디어\n\n[I02](../ideas/I02.md) · [I04](../ideas/I04.md)\n", "html": "\u003ch1>P08 · Experimental evidence on the productivity effects of generative artificial intelligence\u003c/h1>\n\u003cp>\u003ca href=\"#README.md\">위키 홈\u003c/a> · \u003ca href=\"#literature.md\">논문 목록\u003c/a>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>항목\u003c/th>\n\u003cth>내용\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>저자\u003c/td>\n\u003ctd>Shakked Noy; Whitney Zhang\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>발행연도\u003c/td>\n\u003ctd>2023\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>학술지·공개처\u003c/td>\n\u003ctd>Science 381(6654), 187–192\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DOI\u003c/td>\n\u003ctd>10.1126/science.adh2586\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>연구 방식\u003c/td>\n\u003ctd>무작위 실험\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>실제 확인 범위\u003c/td>\n\u003ctd>출판사·PubMed 초록\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>확인일\u003c/td>\n\u003ctd>2026-10-31\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>확인한 내용\u003c/h2>\n\u003cp>전문직 453명의 글쓰기 실험에서 AI 제공 집단은 평균 소요 시간이 40% 줄고 산출물 품질은 18% 높았다. \u003ca href=\"https://doi.org/10.1126/science.adh2586\">출처 확인\u003c/a>\u003c/p>\n\u003ch2>아이디어에 적용할 점 — 조사자의 해석\u003c/h2>\n\u003cp>답변 초안·업무 기록 작성 시간을 측정할 근거.\u003c/p>\n\u003ch2>한계와 원문 확인 사항\u003c/h2>\n\u003cp>글쓰기 실험이므로 고객 만족, 실제 문제 해결, 장기 학습 성과로 바꾸어 인용하면 안 된다. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\u003c/p>\n\u003ch2>연결된 아이디어\u003c/h2>\n\u003cp>\u003ca href=\"#ideas/I02.md\">I02\u003c/a> · \u003ca href=\"#ideas/I04.md\">I04\u003c/a>\u003c/p>\n"}, {"id": "papers/P09.md", "title": "P09 · Blame the Bot: Anthropomorphism and Anger in Customer–Chatbot Interactions", "text": "# P09 · Blame the Bot: Anthropomorphism and Anger in Customer–Chatbot Interactions\n\n[위키 홈](../README.md) · [논문 목록](../literature.md)\n\n| 항목 | 내용 |\n|---|---|\n| 저자 | Cammy Crolic; Felipe Thomaz; Rhonda Hadi; Andrew T. Stephen |\n| 발행연도 | 2022 |\n| 학술지·공개처 | Journal of Marketing 86(1), 132–148 |\n| DOI | 10.1177/00222429211045687 |\n| 연구 방식 | 현장자료·실험 |\n| 실제 확인 범위 | 학회 소개·저자 기관 공개 원문 발췌 |\n| 확인일 | 2026-10-31 |\n\n## 확인한 내용\n\n5개 연구에서 화가 난 상태의 고객에게 챗봇 의인화가 만족·기업 평가 등에 부정적 영향을 보였다. [출처 확인](https://www.ama.org/blame-the-bot-anthropomorphism-and-anger-in-customer-chatbot-interactions/)\n\n## 아이디어에 적용할 점 — 조사자의 해석\n\n감정이 격한 고객에게 과한 친근함보다 빠른 사람 연결과 문제 해결 정보를 제공.\n\n## 한계와 원문 확인 사항\n\n모든 고객에게 인간형 인터페이스가 나쁘다는 결론은 아니다. 온라인 선게재 2021년, 권호 2022년. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\n\n## 연결된 아이디어\n\n[I01](../ideas/I01.md) · [I04](../ideas/I04.md)\n", "html": "\u003ch1>P09 · Blame the Bot: Anthropomorphism and Anger in Customer–Chatbot Interactions\u003c/h1>\n\u003cp>\u003ca href=\"#README.md\">위키 홈\u003c/a> · \u003ca href=\"#literature.md\">논문 목록\u003c/a>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>항목\u003c/th>\n\u003cth>내용\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>저자\u003c/td>\n\u003ctd>Cammy Crolic; Felipe Thomaz; Rhonda Hadi; Andrew T. Stephen\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>발행연도\u003c/td>\n\u003ctd>2022\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>학술지·공개처\u003c/td>\n\u003ctd>Journal of Marketing 86(1), 132–148\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DOI\u003c/td>\n\u003ctd>10.1177/00222429211045687\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>연구 방식\u003c/td>\n\u003ctd>현장자료·실험\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>실제 확인 범위\u003c/td>\n\u003ctd>학회 소개·저자 기관 공개 원문 발췌\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>확인일\u003c/td>\n\u003ctd>2026-10-31\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>확인한 내용\u003c/h2>\n\u003cp>5개 연구에서 화가 난 상태의 고객에게 챗봇 의인화가 만족·기업 평가 등에 부정적 영향을 보였다. \u003ca href=\"https://www.ama.org/blame-the-bot-anthropomorphism-and-anger-in-customer-chatbot-interactions/\">출처 확인\u003c/a>\u003c/p>\n\u003ch2>아이디어에 적용할 점 — 조사자의 해석\u003c/h2>\n\u003cp>감정이 격한 고객에게 과한 친근함보다 빠른 사람 연결과 문제 해결 정보를 제공.\u003c/p>\n\u003ch2>한계와 원문 확인 사항\u003c/h2>\n\u003cp>모든 고객에게 인간형 인터페이스가 나쁘다는 결론은 아니다. 온라인 선게재 2021년, 권호 2022년. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\u003c/p>\n\u003ch2>연결된 아이디어\u003c/h2>\n\u003cp>\u003ca href=\"#ideas/I01.md\">I01\u003c/a> · \u003ca href=\"#ideas/I04.md\">I04\u003c/a>\u003c/p>\n"}, {"id": "papers/P10.md", "title": "P10 · Artificial Intelligence in Utilitarian vs. Hedonic Contexts: The “Word-of-Machine” Effect", "text": "# P10 · Artificial Intelligence in Utilitarian vs. Hedonic Contexts: The “Word-of-Machine” Effect\n\n[위키 홈](../README.md) · [논문 목록](../literature.md)\n\n| 항목 | 내용 |\n|---|---|\n| 저자 | Chiara Longoni; Luca Cian |\n| 발행연도 | 2022 |\n| 학술지·공개처 | Journal of Marketing 86(1), 91–108 |\n| DOI | 10.1177/0022242920957347 |\n| 연구 방식 | 다중 실험 |\n| 실제 확인 범위 | 출판사 초록 |\n| 확인일 | 2026-10-31 |\n\n## 확인한 내용\n\n실용적·쾌락적 속성의 중요성과 AI 추천 선호의 관계를 검증하며 개인의 고유 취향 등 경계조건을 제시한다. [출처 확인](https://journals.sagepub.com/doi/10.1177/0022242920957347)\n\n## 아이디어에 적용할 점 — 조사자의 해석\n\n사실 확인과 취향 판단을 구분하고 고객이 추천 근거와 담당 주체를 선택하게 한다.\n\n## 한계와 원문 확인 사항\n\n분야별 사람·AI 선호가 고정되어 있다는 뜻은 아니다. 선게재 2020년, 권호 2022년. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\n\n## 연결된 아이디어\n\n[I06](../ideas/I06.md) · [I07](../ideas/I07.md)\n", "html": "\u003ch1>P10 · Artificial Intelligence in Utilitarian vs. Hedonic Contexts: The “Word-of-Machine” Effect\u003c/h1>\n\u003cp>\u003ca href=\"#README.md\">위키 홈\u003c/a> · \u003ca href=\"#literature.md\">논문 목록\u003c/a>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>항목\u003c/th>\n\u003cth>내용\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>저자\u003c/td>\n\u003ctd>Chiara Longoni; Luca Cian\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>발행연도\u003c/td>\n\u003ctd>2022\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>학술지·공개처\u003c/td>\n\u003ctd>Journal of Marketing 86(1), 91–108\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DOI\u003c/td>\n\u003ctd>10.1177/0022242920957347\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>연구 방식\u003c/td>\n\u003ctd>다중 실험\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>실제 확인 범위\u003c/td>\n\u003ctd>출판사 초록\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>확인일\u003c/td>\n\u003ctd>2026-10-31\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>확인한 내용\u003c/h2>\n\u003cp>실용적·쾌락적 속성의 중요성과 AI 추천 선호의 관계를 검증하며 개인의 고유 취향 등 경계조건을 제시한다. \u003ca href=\"https://journals.sagepub.com/doi/10.1177/0022242920957347\">출처 확인\u003c/a>\u003c/p>\n\u003ch2>아이디어에 적용할 점 — 조사자의 해석\u003c/h2>\n\u003cp>사실 확인과 취향 판단을 구분하고 고객이 추천 근거와 담당 주체를 선택하게 한다.\u003c/p>\n\u003ch2>한계와 원문 확인 사항\u003c/h2>\n\u003cp>분야별 사람·AI 선호가 고정되어 있다는 뜻은 아니다. 선게재 2020년, 권호 2022년. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\u003c/p>\n\u003ch2>연결된 아이디어\u003c/h2>\n\u003cp>\u003ca href=\"#ideas/I06.md\">I06\u003c/a> · \u003ca href=\"#ideas/I07.md\">I07\u003c/a>\u003c/p>\n"}, {"id": "papers/P11.md", "title": "P11 · When combinations of humans and AI are useful: A systematic review and meta-analysis", "text": "# P11 · When combinations of humans and AI are useful: A systematic review and meta-analysis\n\n[위키 홈](../README.md) · [논문 목록](../literature.md)\n\n| 항목 | 내용 |\n|---|---|\n| 저자 | Michelle Vaccaro; Abdullah Almaatouq; Thomas Malone |\n| 발행연도 | 2024 |\n| 학술지·공개처 | Nature Human Behaviour 8, 2293–2303 |\n| DOI | 10.1038/s41562-024-02024-1 |\n| 연구 방식 | 체계적 문헌고찰·메타분석 |\n| 실제 확인 범위 | 공개 본문 결과·방법 일부 |\n| 확인일 | 2026-10-31 |\n\n## 확인한 내용\n\n106개 실험, 370개 효과크기 분석에서 인간-AI 조합은 평균적으로 인간 단독보다 좋았지만 인간·AI 중 더 나은 단독 기준보다 낮았다. [출처 확인](https://www.nature.com/articles/s41562-024-02024-1)\n\n## 아이디어에 적용할 점 — 조사자의 해석\n\n인간 단독·AI 단독·협업을 모두 비교하고 검수자의 과신도 측정.\n\n## 한계와 원문 확인 사항\n\n연구 간 이질성이 크며 포함 실험의 발표 기간은 2020년부터 2023년 6월까지다. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\n\n## 연결된 아이디어\n\n[I01](../ideas/I01.md) · [I02](../ideas/I02.md) · [I08](../ideas/I08.md)\n", "html": "\u003ch1>P11 · When combinations of humans and AI are useful: A systematic review and meta-analysis\u003c/h1>\n\u003cp>\u003ca href=\"#README.md\">위키 홈\u003c/a> · \u003ca href=\"#literature.md\">논문 목록\u003c/a>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>항목\u003c/th>\n\u003cth>내용\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>저자\u003c/td>\n\u003ctd>Michelle Vaccaro; Abdullah Almaatouq; Thomas Malone\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>발행연도\u003c/td>\n\u003ctd>2024\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>학술지·공개처\u003c/td>\n\u003ctd>Nature Human Behaviour 8, 2293–2303\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DOI\u003c/td>\n\u003ctd>10.1038/s41562-024-02024-1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>연구 방식\u003c/td>\n\u003ctd>체계적 문헌고찰·메타분석\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>실제 확인 범위\u003c/td>\n\u003ctd>공개 본문 결과·방법 일부\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>확인일\u003c/td>\n\u003ctd>2026-10-31\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>확인한 내용\u003c/h2>\n\u003cp>106개 실험, 370개 효과크기 분석에서 인간-AI 조합은 평균적으로 인간 단독보다 좋았지만 인간·AI 중 더 나은 단독 기준보다 낮았다. \u003ca href=\"https://www.nature.com/articles/s41562-024-02024-1\">출처 확인\u003c/a>\u003c/p>\n\u003ch2>아이디어에 적용할 점 — 조사자의 해석\u003c/h2>\n\u003cp>인간 단독·AI 단독·협업을 모두 비교하고 검수자의 과신도 측정.\u003c/p>\n\u003ch2>한계와 원문 확인 사항\u003c/h2>\n\u003cp>연구 간 이질성이 크며 포함 실험의 발표 기간은 2020년부터 2023년 6월까지다. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\u003c/p>\n\u003ch2>연결된 아이디어\u003c/h2>\n\u003cp>\u003ca href=\"#ideas/I01.md\">I01\u003c/a> · \u003ca href=\"#ideas/I02.md\">I02\u003c/a> · \u003ca href=\"#ideas/I08.md\">I08\u003c/a>\u003c/p>\n"}, {"id": "papers/P12.md", "title": "P12 · Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks", "text": "# P12 · Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks\n\n[위키 홈](../README.md) · [논문 목록](../literature.md)\n\n| 항목 | 내용 |\n|---|---|\n| 저자 | Patrick Lewis et al. |\n| 발행연도 | 2020 |\n| 학술지·공개처 | NeurIPS 2020 |\n| DOI | 10.48550/arXiv.2005.11401 |\n| 연구 방식 | 기술 실험 |\n| 실제 확인 범위 | 저자 공개 초록 |\n| 확인일 | 2026-10-31 |\n\n## 확인한 내용\n\n외부 검색 메모리와 생성 모델을 결합해 지식 집약 과제를 수행한다. [출처 확인](https://arxiv.org/abs/2005.11401)\n\n## 아이디어에 적용할 점 — 조사자의 해석\n\n규정과 승인된 사례를 검색하고 출처를 붙이는 상담 지원의 기술적 기초.\n\n## 한계와 원문 확인 사항\n\n초기 RAG의 과제 성능이 최신 서비스의 무환각·정책 준수를 보장하지 않는다. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\n\n## 연결된 아이디어\n\n[I01](../ideas/I01.md) · [I02](../ideas/I02.md) · [I05](../ideas/I05.md) · [I08](../ideas/I08.md)\n", "html": "\u003ch1>P12 · Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks\u003c/h1>\n\u003cp>\u003ca href=\"#README.md\">위키 홈\u003c/a> · \u003ca href=\"#literature.md\">논문 목록\u003c/a>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>항목\u003c/th>\n\u003cth>내용\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>저자\u003c/td>\n\u003ctd>Patrick Lewis et al.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>발행연도\u003c/td>\n\u003ctd>2020\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>학술지·공개처\u003c/td>\n\u003ctd>NeurIPS 2020\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DOI\u003c/td>\n\u003ctd>10.48550/arXiv.2005.11401\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>연구 방식\u003c/td>\n\u003ctd>기술 실험\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>실제 확인 범위\u003c/td>\n\u003ctd>저자 공개 초록\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>확인일\u003c/td>\n\u003ctd>2026-10-31\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>확인한 내용\u003c/h2>\n\u003cp>외부 검색 메모리와 생성 모델을 결합해 지식 집약 과제를 수행한다. \u003ca href=\"https://arxiv.org/abs/2005.11401\">출처 확인\u003c/a>\u003c/p>\n\u003ch2>아이디어에 적용할 점 — 조사자의 해석\u003c/h2>\n\u003cp>규정과 승인된 사례를 검색하고 출처를 붙이는 상담 지원의 기술적 기초.\u003c/p>\n\u003ch2>한계와 원문 확인 사항\u003c/h2>\n\u003cp>초기 RAG의 과제 성능이 최신 서비스의 무환각·정책 준수를 보장하지 않는다. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\u003c/p>\n\u003ch2>연결된 아이디어\u003c/h2>\n\u003cp>\u003ca href=\"#ideas/I01.md\">I01\u003c/a> · \u003ca href=\"#ideas/I02.md\">I02\u003c/a> · \u003ca href=\"#ideas/I05.md\">I05\u003c/a> · \u003ca href=\"#ideas/I08.md\">I08\u003c/a>\u003c/p>\n"}, {"id": "papers/P13.md", "title": "P13 · Lost in the Middle: How Language Models Use Long Contexts", "text": "# P13 · Lost in the Middle: How Language Models Use Long Contexts\n\n[위키 홈](../README.md) · [논문 목록](../literature.md)\n\n| 항목 | 내용 |\n|---|---|\n| 저자 | Nelson F. Liu et al. |\n| 발행연도 | 2024 |\n| 학술지·공개처 | Transactions of the Association for Computational Linguistics 12, 157–173 |\n| DOI | 10.1162/tacl_a_00638 |\n| 연구 방식 | 기술 실험 |\n| 실제 확인 범위 | 학회 초록·공개 원문 발췌 |\n| 확인일 | 2026-10-31 |\n\n## 확인한 내용\n\n관련 정보가 긴 입력의 어디에 놓이는지에 따라 모델 성능이 변하는 현상을 검증했다. [출처 확인](https://aclanthology.org/2024.tacl-1.9/)\n\n## 아이디어에 적용할 점 — 조사자의 해석\n\n상담 기록 전체를 붙이는 방법과 구조화된 인계 카드를 비교.\n\n## 한계와 원문 확인 사항\n\n연구 당시 모델 결과이며 현재 모든 모델이 같은 정도로 실패한다고 단정할 수 없다. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\n\n## 연결된 아이디어\n\n[I01](../ideas/I01.md) · [I08](../ideas/I08.md)\n", "html": "\u003ch1>P13 · Lost in the Middle: How Language Models Use Long Contexts\u003c/h1>\n\u003cp>\u003ca href=\"#README.md\">위키 홈\u003c/a> · \u003ca href=\"#literature.md\">논문 목록\u003c/a>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>항목\u003c/th>\n\u003cth>내용\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>저자\u003c/td>\n\u003ctd>Nelson F. Liu et al.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>발행연도\u003c/td>\n\u003ctd>2024\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>학술지·공개처\u003c/td>\n\u003ctd>Transactions of the Association for Computational Linguistics 12, 157–173\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DOI\u003c/td>\n\u003ctd>10.1162/tacl_a_00638\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>연구 방식\u003c/td>\n\u003ctd>기술 실험\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>실제 확인 범위\u003c/td>\n\u003ctd>학회 초록·공개 원문 발췌\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>확인일\u003c/td>\n\u003ctd>2026-10-31\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>확인한 내용\u003c/h2>\n\u003cp>관련 정보가 긴 입력의 어디에 놓이는지에 따라 모델 성능이 변하는 현상을 검증했다. \u003ca href=\"https://aclanthology.org/2024.tacl-1.9/\">출처 확인\u003c/a>\u003c/p>\n\u003ch2>아이디어에 적용할 점 — 조사자의 해석\u003c/h2>\n\u003cp>상담 기록 전체를 붙이는 방법과 구조화된 인계 카드를 비교.\u003c/p>\n\u003ch2>한계와 원문 확인 사항\u003c/h2>\n\u003cp>연구 당시 모델 결과이며 현재 모든 모델이 같은 정도로 실패한다고 단정할 수 없다. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\u003c/p>\n\u003ch2>연결된 아이디어\u003c/h2>\n\u003cp>\u003ca href=\"#ideas/I01.md\">I01\u003c/a> · \u003ca href=\"#ideas/I08.md\">I08\u003c/a>\u003c/p>\n"}, {"id": "papers/P14.md", "title": "P14 · τ-bench: A Benchmark for Tool-Agent-User Interaction in Real-World Domains", "text": "# P14 · τ-bench: A Benchmark for Tool-Agent-User Interaction in Real-World Domains\n\n[위키 홈](../README.md) · [논문 목록](../literature.md)\n\n| 항목 | 내용 |\n|---|---|\n| 저자 | Shunyu Yao; Noah Shinn; Pedram Razavi; Karthik Narasimhan |\n| 발행연도 | 2024 |\n| 학술지·공개처 | arXiv 연구보고서 |\n| DOI | 10.48550/arXiv.2406.12045 |\n| 연구 방식 | 벤치마크 |\n| 실제 확인 범위 | 저자 공개 초록 |\n| 확인일 | 2026-10-31 |\n\n## 확인한 내용\n\n도구·정책·사용자 상호작용을 결합하고 최종 데이터베이스 상태 및 반복 성공의 일관성을 평가한다. [출처 확인](https://arxiv.org/abs/2406.12045)\n\n## 아이디어에 적용할 점 — 조사자의 해석\n\n답변이 그럴듯한지를 넘어 환불·변경의 최종 상태가 맞는지 평가.\n\n## 한계와 원문 확인 사항\n\n이번 조사에서는 arXiv 공개본 기준. 시뮬레이션 성과는 실제 고객 만족과 별개. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\n\n## 연결된 아이디어\n\n[I01](../ideas/I01.md) · [I08](../ideas/I08.md)\n", "html": "\u003ch1>P14 · τ-bench: A Benchmark for Tool-Agent-User Interaction in Real-World Domains\u003c/h1>\n\u003cp>\u003ca href=\"#README.md\">위키 홈\u003c/a> · \u003ca href=\"#literature.md\">논문 목록\u003c/a>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>항목\u003c/th>\n\u003cth>내용\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>저자\u003c/td>\n\u003ctd>Shunyu Yao; Noah Shinn; Pedram Razavi; Karthik Narasimhan\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>발행연도\u003c/td>\n\u003ctd>2024\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>학술지·공개처\u003c/td>\n\u003ctd>arXiv 연구보고서\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DOI\u003c/td>\n\u003ctd>10.48550/arXiv.2406.12045\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>연구 방식\u003c/td>\n\u003ctd>벤치마크\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>실제 확인 범위\u003c/td>\n\u003ctd>저자 공개 초록\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>확인일\u003c/td>\n\u003ctd>2026-10-31\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>확인한 내용\u003c/h2>\n\u003cp>도구·정책·사용자 상호작용을 결합하고 최종 데이터베이스 상태 및 반복 성공의 일관성을 평가한다. \u003ca href=\"https://arxiv.org/abs/2406.12045\">출처 확인\u003c/a>\u003c/p>\n\u003ch2>아이디어에 적용할 점 — 조사자의 해석\u003c/h2>\n\u003cp>답변이 그럴듯한지를 넘어 환불·변경의 최종 상태가 맞는지 평가.\u003c/p>\n\u003ch2>한계와 원문 확인 사항\u003c/h2>\n\u003cp>이번 조사에서는 arXiv 공개본 기준. 시뮬레이션 성과는 실제 고객 만족과 별개. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\u003c/p>\n\u003ch2>연결된 아이디어\u003c/h2>\n\u003cp>\u003ca href=\"#ideas/I01.md\">I01\u003c/a> · \u003ca href=\"#ideas/I08.md\">I08\u003c/a>\u003c/p>\n"}, {"id": "papers/P15.md", "title": "P15 · τ²-Bench: Evaluating Conversational Agents in a Dual-Control Environment", "text": "# P15 · τ²-Bench: Evaluating Conversational Agents in a Dual-Control Environment\n\n[위키 홈](../README.md) · [논문 목록](../literature.md)\n\n| 항목 | 내용 |\n|---|---|\n| 저자 | Victor Barres; Honghua Dong; Soham Ray; Xujie Si; Karthik Narasimhan |\n| 발행연도 | 2025 |\n| 학술지·공개처 | arXiv 연구보고서 |\n| DOI | 10.48550/arXiv.2506.07982 |\n| 연구 방식 | 벤치마크 |\n| 실제 확인 범위 | 저자 공개 초록 |\n| 확인일 | 2026-10-31 |\n\n## 확인한 내용\n\n고객과 에이전트가 함께 환경을 바꾸는 기술지원 과제를 도입하고 추론과 소통·조정 실패를 구분한다. [출처 확인](https://arxiv.org/abs/2506.07982)\n\n## 아이디어에 적용할 점 — 조사자의 해석\n\n시니어 안내나 기기 문제 해결에서 사용자가 실제 단계를 수행했는지 확인.\n\n## 한계와 원문 확인 사항\n\n이번 조사에서는 arXiv 공개본 기준. 시뮬레이션 사용자와 실제 시니어는 다르다. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\n\n## 연결된 아이디어\n\n[I03](../ideas/I03.md) · [I08](../ideas/I08.md)\n", "html": "\u003ch1>P15 · τ²-Bench: Evaluating Conversational Agents in a Dual-Control Environment\u003c/h1>\n\u003cp>\u003ca href=\"#README.md\">위키 홈\u003c/a> · \u003ca href=\"#literature.md\">논문 목록\u003c/a>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>항목\u003c/th>\n\u003cth>내용\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>저자\u003c/td>\n\u003ctd>Victor Barres; Honghua Dong; Soham Ray; Xujie Si; Karthik Narasimhan\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>발행연도\u003c/td>\n\u003ctd>2025\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>학술지·공개처\u003c/td>\n\u003ctd>arXiv 연구보고서\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DOI\u003c/td>\n\u003ctd>10.48550/arXiv.2506.07982\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>연구 방식\u003c/td>\n\u003ctd>벤치마크\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>실제 확인 범위\u003c/td>\n\u003ctd>저자 공개 초록\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>확인일\u003c/td>\n\u003ctd>2026-10-31\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>확인한 내용\u003c/h2>\n\u003cp>고객과 에이전트가 함께 환경을 바꾸는 기술지원 과제를 도입하고 추론과 소통·조정 실패를 구분한다. \u003ca href=\"https://arxiv.org/abs/2506.07982\">출처 확인\u003c/a>\u003c/p>\n\u003ch2>아이디어에 적용할 점 — 조사자의 해석\u003c/h2>\n\u003cp>시니어 안내나 기기 문제 해결에서 사용자가 실제 단계를 수행했는지 확인.\u003c/p>\n\u003ch2>한계와 원문 확인 사항\u003c/h2>\n\u003cp>이번 조사에서는 arXiv 공개본 기준. 시뮬레이션 사용자와 실제 시니어는 다르다. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\u003c/p>\n\u003ch2>연결된 아이디어\u003c/h2>\n\u003cp>\u003ca href=\"#ideas/I03.md\">I03\u003c/a> · \u003ca href=\"#ideas/I08.md\">I08\u003c/a>\u003c/p>\n"}, {"id": "papers/P16.md", "title": "P16 · 생성형 AI는 인간 관리자를 대체할 수 있는가? 자동 생성된 관리자 응답이 고객에 미치는 영향", "text": "# P16 · 생성형 AI는 인간 관리자를 대체할 수 있는가? 자동 생성된 관리자 응답이 고객에 미치는 영향\n\n[위키 홈](../README.md) · [논문 목록](../literature.md)\n\n| 항목 | 내용 |\n|---|---|\n| 저자 | 박예은; 안현철 |\n| 발행연도 | 2023 |\n| 학술지·공개처 | 지식경영연구 24(4), 153–176 |\n| DOI | 10.15813/kmr.2023.24.4.008 |\n| 연구 방식 | 실험·설문 |\n| 실제 확인 범위 | KCI 초록 |\n| 확인일 | 2026-10-31 |\n\n## 확인한 내용\n\n음식 배달 리뷰 맥락에서 긍정 리뷰와 달리 부정 리뷰는 인간 관리자의 개입이 더 바람직하다고 보고했다. [출처 확인](https://www.kci.go.kr/kciportal/landing/article.kci?arti_id=ART003028527)\n\n## 아이디어에 적용할 점 — 조사자의 해석\n\n부정적 경험 처리 시 담당자 검토와 이관 기능의 직접적인 국내 근거.\n\n## 한계와 원문 확인 사항\n\n초록 확인 범위이며 표본·자극물·세부 효과크기는 원문 확인 전 확정하지 않는다. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\n\n## 연결된 아이디어\n\n[I01](../ideas/I01.md) · [I04](../ideas/I04.md)\n", "html": "\u003ch1>P16 · 생성형 AI는 인간 관리자를 대체할 수 있는가? 자동 생성된 관리자 응답이 고객에 미치는 영향\u003c/h1>\n\u003cp>\u003ca href=\"#README.md\">위키 홈\u003c/a> · \u003ca href=\"#literature.md\">논문 목록\u003c/a>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>항목\u003c/th>\n\u003cth>내용\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>저자\u003c/td>\n\u003ctd>박예은; 안현철\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>발행연도\u003c/td>\n\u003ctd>2023\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>학술지·공개처\u003c/td>\n\u003ctd>지식경영연구 24(4), 153–176\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DOI\u003c/td>\n\u003ctd>10.15813/kmr.2023.24.4.008\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>연구 방식\u003c/td>\n\u003ctd>실험·설문\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>실제 확인 범위\u003c/td>\n\u003ctd>KCI 초록\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>확인일\u003c/td>\n\u003ctd>2026-10-31\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>확인한 내용\u003c/h2>\n\u003cp>음식 배달 리뷰 맥락에서 긍정 리뷰와 달리 부정 리뷰는 인간 관리자의 개입이 더 바람직하다고 보고했다. \u003ca href=\"https://www.kci.go.kr/kciportal/landing/article.kci?arti_id=ART003028527\">출처 확인\u003c/a>\u003c/p>\n\u003ch2>아이디어에 적용할 점 — 조사자의 해석\u003c/h2>\n\u003cp>부정적 경험 처리 시 담당자 검토와 이관 기능의 직접적인 국내 근거.\u003c/p>\n\u003ch2>한계와 원문 확인 사항\u003c/h2>\n\u003cp>초록 확인 범위이며 표본·자극물·세부 효과크기는 원문 확인 전 확정하지 않는다. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\u003c/p>\n\u003ch2>연결된 아이디어\u003c/h2>\n\u003cp>\u003ca href=\"#ideas/I01.md\">I01\u003c/a> · \u003ca href=\"#ideas/I04.md\">I04\u003c/a>\u003c/p>\n"}, {"id": "papers/P17.md", "title": "P17 · 디지털 트랜스포메이션 시대, 시니어 소비자의 디지털 소비여건 신뢰 형성 요인 연구", "text": "# P17 · 디지털 트랜스포메이션 시대, 시니어 소비자의 디지털 소비여건 신뢰 형성 요인 연구\n\n[위키 홈](../README.md) · [논문 목록](../literature.md)\n\n| 항목 | 내용 |\n|---|---|\n| 저자 | 전미나; 김미예; 한정수 |\n| 발행연도 | 2022 |\n| 학술지·공개처 | 지식경영연구 23(4), 91–112 |\n| DOI | 10.15813/kmr.2022.23.4.005 |\n| 연구 방식 | 2차 자료 실증 |\n| 실제 확인 범위 | KCI 초록 |\n| 확인일 | 2026-10-31 |\n\n## 확인한 내용\n\n60대 이상 1,703명의 자료에서 소비 역량·기업책임인식·문제해결 창구 인식과 디지털 신뢰의 관계를 확인했다. [출처 확인](https://www.kci.go.kr/kciportal/landing/article.kci?arti_id=ART002912987)\n\n## 아이디어에 적용할 점 — 조사자의 해석\n\n도움 요청 경로를 눈에 보이게 하고 스스로 처리할 수 있다는 경험을 제공.\n\n## 한계와 원문 확인 사항\n\n관찰자료의 관련성을 UI 개편의 인과적 효과로 해석하지 않는다. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\n\n## 연결된 아이디어\n\n[I03](../ideas/I03.md)\n", "html": "\u003ch1>P17 · 디지털 트랜스포메이션 시대, 시니어 소비자의 디지털 소비여건 신뢰 형성 요인 연구\u003c/h1>\n\u003cp>\u003ca href=\"#README.md\">위키 홈\u003c/a> · \u003ca href=\"#literature.md\">논문 목록\u003c/a>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>항목\u003c/th>\n\u003cth>내용\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>저자\u003c/td>\n\u003ctd>전미나; 김미예; 한정수\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>발행연도\u003c/td>\n\u003ctd>2022\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>학술지·공개처\u003c/td>\n\u003ctd>지식경영연구 23(4), 91–112\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DOI\u003c/td>\n\u003ctd>10.15813/kmr.2022.23.4.005\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>연구 방식\u003c/td>\n\u003ctd>2차 자료 실증\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>실제 확인 범위\u003c/td>\n\u003ctd>KCI 초록\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>확인일\u003c/td>\n\u003ctd>2026-10-31\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>확인한 내용\u003c/h2>\n\u003cp>60대 이상 1,703명의 자료에서 소비 역량·기업책임인식·문제해결 창구 인식과 디지털 신뢰의 관계를 확인했다. \u003ca href=\"https://www.kci.go.kr/kciportal/landing/article.kci?arti_id=ART002912987\">출처 확인\u003c/a>\u003c/p>\n\u003ch2>아이디어에 적용할 점 — 조사자의 해석\u003c/h2>\n\u003cp>도움 요청 경로를 눈에 보이게 하고 스스로 처리할 수 있다는 경험을 제공.\u003c/p>\n\u003ch2>한계와 원문 확인 사항\u003c/h2>\n\u003cp>관찰자료의 관련성을 UI 개편의 인과적 효과로 해석하지 않는다. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\u003c/p>\n\u003ch2>연결된 아이디어\u003c/h2>\n\u003cp>\u003ca href=\"#ideas/I03.md\">I03\u003c/a>\u003c/p>\n"}, {"id": "papers/P18.md", "title": "P18 · BERTopic 모델을 이용한 항공사 서비스에서 지각된 고객가치가 고객 만족도에 미치는 영향 분석", "text": "# P18 · BERTopic 모델을 이용한 항공사 서비스에서 지각된 고객가치가 고객 만족도에 미치는 영향 분석\n\n[위키 홈](../README.md) · [논문 목록](../literature.md)\n\n| 항목 | 내용 |\n|---|---|\n| 저자 | 정의주; 이병현; LI QINGLONG; 김재경 |\n| 발행연도 | 2023 |\n| 학술지·공개처 | 지식경영연구 24(3), 95–125 |\n| DOI | 10.15813/kmr.2023.24.3.006 |\n| 연구 방식 | 리뷰 데이터 분석 |\n| 실제 확인 범위 | KCI 초록 |\n| 확인일 | 2026-10-31 |\n\n## 확인한 내용\n\nSkytrax 리뷰·평점에서 9개 고객가치 요소를 도출하고 6개 요소와 만족도의 관련성을 보고했다. [출처 확인](https://www.kci.go.kr/kciportal/landing/article.kci?arti_id=ART002999768)\n\n## 아이디어에 적용할 점 — 조사자의 해석\n\n리뷰를 문제 유형별로 묶고 개선 작업과 연결하는 분석 출발점.\n\n## 한계와 원문 확인 사항\n\n리뷰 작성자 편향과 상관관계의 한계가 있다. 항공사의 요인 체계를 카페에 그대로 적용하지 않는다. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\n\n## 연결된 아이디어\n\n[I04](../ideas/I04.md) · [I06](../ideas/I06.md)\n", "html": "\u003ch1>P18 · BERTopic 모델을 이용한 항공사 서비스에서 지각된 고객가치가 고객 만족도에 미치는 영향 분석\u003c/h1>\n\u003cp>\u003ca href=\"#README.md\">위키 홈\u003c/a> · \u003ca href=\"#literature.md\">논문 목록\u003c/a>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>항목\u003c/th>\n\u003cth>내용\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbod n\n[I01](../ideas/I01.md) · [I02](../ideas/I02.md) · [I08](../ideas/I08.md)\n", "html": "\u003ch1>P19 · 지식 기반 QA개선을 위한 Advanced RAG 시스템 구현 방법: Graph Agent 활용\u003c/h1>\n\u003cp>\u003ca href=\"#README.md\">위키 홈\u003c/a> · \u003ca href=\"#literature.md\">논문 목록\u003c/a>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>항목\u003c/th>\n\u003cth>내용\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>저자\u003c/td>\n\u003ctd>정천수\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>발행연도\u003c/td>\n\u003ctd>2024\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>학술지·공개처\u003c/td>\n\u003ctd>지식경영연구 25(3), 99–119\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DOI\u003c/td>\n\u003ctd>10.15813/kmr.2024.25.3.005\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>연구 방식\u003c/td>\n\u003ctd>시스템 구현\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>실제 확인 범위\u003c/td>\n\u003ctd>KCI 초록\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>확인일\u003c/td>\n\u003ctd>2026-10-31\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>확인한 내용\u003c/h2>\n\u003cp>LangGraph를 이용해 검색 정보의 신뢰성을 평가하고 종합하는 구현 방법을 제시했다. \u003ca href=\"https://www.kci.go.kr/kciportal/landing/article.kci?arti_id=ART003120450\">출처 확인\u003c/a>\u003c/p>\n\u003ch2>아이디어에 적용할 점 — 조사자의 해석\u003c/h2>\n\u003cp>검색·근거 확인·재검색·사람 검토를 분리하는 흐름 설계.\u003c/p>\n\u003ch2>한계와 원문 확인 사항\u003c/h2>\n\u003cp>초록만으로 비교 성능을 확정할 수 없다. LangGraph 제어 흐름과 지식그래프를 혼동하지 않는다. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\u003c/p>\n\u003ch2>연결된 아이디어\u003c/h2>\n\u003cp>\u003ca href=\"#ideas/I01.md\">I01\u003c/a> · \u003ca href=\"#ideas/I02.md\">I02\u003c/a> · \u003ca href=\"#ideas/I08.md\">I08\u003c/a>\u003c/p>\n"}, {"id": "papers/P20.md", "title": "P20 · 생성형 AI에 대한 신뢰와 구매의도: 촉진과 억제요인 중심으로", "text": "# P20 · 생성형 AI에 대한 신뢰와 구매의도: 촉진과 억제요인 중심으로\n\n[위키 홈](../README.md) · [논문 목록](../literature.md)\n\n| 항목 | 내용 |\n|---|---|\n| 저자 | 박대성; 김헌준; 장혜원; 박일수 |\n| 발행연도 | 2025 |\n| 학술지·공개처 | 지식경영연구 26(3), 175–202 |\n| DOI | 10.15813/kmr.2025.26.3.009 |\n| 연구 방식 | 설문·PLS-SEM |\n| 실제 확인 범위 | KCI 초록 |\n| 확인일 | 2026-10-31 |\n\n## 확인한 내용\n\n사용자 376명의 자료에서 정보품질의 촉진 효과와 프라이버시 염려를 통한 억제 경로를 보고했다. [출처 확인](https://www.kci.go.kr/kciportal/landing/article.kci?arti_id=ART003248276)\n\n## 아이디어에 적용할 점 — 조사자의 해석\n\n도움이 되는 정보량과 고객이 허용한 공유 범위를 함께 설계.\n\n## 한계와 원문 확인 사항\n\n자기보고 구매의도를 실제 구매나 보안 수준으로 동일시하지 않는다. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\n\n## 연결된 아이디어\n\n[I01](../ideas/I01.md) · [I07](../ideas/I07.md)\n", "html": "\u003ch1>P20 · 생성형 AI에 대한 신뢰와 구매의도: 촉진과 억제요인 중심으로\u003c/h1>\n\u003cp>\u003ca href=\"#README.md\">위키 홈\u003c/a> · \u003ca href=\"#literature.md\">논문 목록\u003c/a>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>항목\u003c/th>\n\u003cth>내용\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>저자\u003c/td>\n\u003ctd>박대성; 김헌준; 장혜원; 박일수\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>발행연도\u003c/td>\n\u003ctd>2025\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>학술지·공개처\u003c/td>\n\u003ctd>지식경영연구 26(3), 175–202\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DOI\u003c/td>\n\u003ctd>10.15813/kmr.2025.26.3.009\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>연구 방식\u003c/td>\n\u003ctd>설문·PLS-SEM\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>실제 확인 범위\u003c/td>\n\u003ctd>KCI 초록\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>확인일\u003c/td>\n\u003ctd>2026-10-31\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>확인한 내용\u003c/h2>\n\u003cp>사용자 376명의 자료에서 정보품질의 촉진 효과와 프라이버시 염려를 통한 억제 경로를 보고했다. \u003ca href=\"https://www.kci.go.kr/kciportal/landing/article.kci?arti_id=ART003248276\">출처 확인\u003c/a>\u003c/p>\n\u003ch2>아이디어에 적용할 점 — 조사자의 해석\u003c/h2>\n\u003cp>도움이 되는 정보량과 고객이 허용한 공유 범위를 함께 설계.\u003c/p>\n\u003ch2>한계와 원문 확인 사항\u003c/h2>\n\u003cp>자기보고 구매의도를 실제 구매나 보안 수준으로 동일시하지 않는다. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\u003c/p>\n\u003ch2>연결된 아이디어\u003c/h2>\n\u003cp>\u003ca href=\"#ideas/I01.md\">I01\u003c/a> · \u003ca href=\"#ideas/I07.md\">I07\u003c/a>\u003c/p>\n"}, {"id": "papers/P21.md", "title": "P21 · 생성형 AI에 대한 감정요인이 AI 리터러시와 프라이버시 우려에 미치는 영향", "text": "# P21 · 생성형 AI에 대한 감정요인이 AI 리터러시와 프라이버시 우려에 미치는 영향\n\n[위키 홈](../README.md) · [논문 목록](../literature.md)\n\n| 항목 | 내용 |\n|---|---|\n| 저자 | 김현정; 노환호; 문지원; 이정현; 김범수 |\n| 발행연도 | 2024 |\n| 학술지·공개처 | 지식경영연구 25(4), 1–30 |\n| DOI | 10.15813/kmr.2024.25.4.001 |\n| 연구 방식 | 설문·PLS-SEM |\n| 실제 확인 범위 | KCI 초록 |\n| 확인일 | 2026-10-31 |\n\n## 확인한 내용\n\n성인 사용자 500명 자료에서 AI 리터러시와 프라이버시 우려의 관계 등을 분석했다. [출처 확인](https://www.kci.go.kr/kciportal/landing/article.kci?arti_id=ART003157393)\n\n## 아이디어에 적용할 점 — 조사자의 해석\n\n교육만 늘리면 개인정보 우려가 사라진다고 가정하지 않고 공유 통제를 제공.\n\n## 한계와 원문 확인 사항\n\n횡단 설문이므로 교육 개입의 인과 효과로 해석하지 않는다. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\n\n## 연결된 아이디어\n\n[I03](../ideas/I03.md) · [I07](../ideas/I07.md)\n", "html": "\u003ch1>P21 · 생성형 AI에 대한 감정요인이 AI 리터러시와 프라이버시 우려에 미치는 영향\u003c/h1>\n\u003cp>\u003ca href=\"#README.md\">위키 홈\u003c/a> · \u003ca href=\"#literature.md\">논문 목록\u003c/a>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>항목\u003c/th>\n\u003cth>내용\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>저자\u003c/td>\n\u003ctd>김현정; 노환호; 문지원; 이정현; 김범수\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>발행연도\u003c/td>\n\u003ctd>2024\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>학술지·공개처\u003c/td>\n\u003ctd>지식경영연구 25(4), 1–30\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DOI\u003c/td>\n\u003ctd>10.15813/kmr.2024.25.4.001\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>연구 방식\u003c/td>\n\u003ctd>설문·PLS-SEM\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>실제 확인 범위\u003c/td>\n\u003ctd>KCI 초록\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>확인일\u003c/td>\n\u003ctd>2026-10-31\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>확인한 내용\u003c/h2>\n\u003cp>성인 사용자 500명 자료에서 AI 리터러시와 프라이버시 우려의 관계 등을 분석했다. \u003ca href=\"https://www.kci.go.kr/kciportal/landing/article.kci?arti_id=ART003157393\">출처 확인\u003c/a>\u003c/p>\n\u003ch2>아이디어에 적용할 점 — 조사자의 해석\u003c/h2>\n\u003cp>교육만 늘리면 개인정보 우려가 사라진다고 가정하지 않고 공유 통제를 제공.\u003c/p>\n\u003ch2>한계와 원문 확인 사항\u003c/h2>\n\u003cp>횡단 설문이므로 교육 개입의 인과 효과로 해석하지 않는다. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\u003c/p>\n\u003ch2>연결된 아이디어\u003c/h2>\n\u003cp>\u003ca href=\"#ideas/I03.md\">I03\u003c/a> · \u003ca href=\"#ideas/I07.md\">I07\u003c/a>\u003c/p>\n"}, {"id": "papers/P22.md", "title": "P22 · 대규모 언어 모델(LLM) 환경의 프라이버시 리스크 대응을 위한 개념 모델 제안", "text": "# P22 · 대규모 언어 모델(LLM) 환경의 프라이버시 리스크 대응을 위한 개념 모델 제안\n\n[위키 홈](../README.md) · [논문 목록](../literature.md)\n\n| 항목 | 내용 |\n|---|---|\n| 저자 | 장재영; 김범수; 이중엽 |\n| 발행연도 | 2025 |\n| 학술지·공개처 | 지식경영연구 26(2), 23–42 |\n| DOI | 10.15813/kmr.2025.26.2.002 |\n| 연구 방식 | 개념 모델 |\n| 실제 확인 범위 | KCI 초록 |\n| 확인일 | 2026-10-31 |\n\n## 확인한 내용\n\n수집부터 학습·서비스 제공까지 개인정보 생애주기의 위험을 정보주체 관점에서 다룬다. [출처 확인](https://www.kci.go.kr/kciportal/landing/article.kci?arti_id=ART003213984)\n\n## 아이디어에 적용할 점 — 조사자의 해석\n\n개인별 상담 기록과 재사용용 지식 카드를 분리하고 수정·삭제 경로를 설계.\n\n## 한계와 원문 확인 사항\n\n법률 준수 인증이나 실제 시스템의 보호 성능을 입증한 연구는 아니다. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\n\n## 연결된 아이디어\n\n[I01](../ideas/I01.md) · [I02](../ideas/I02.md) · [I07](../ideas/I07.md)\n", "html": "\u003ch1>P22 · 대규모 언어 모델(LLM) 환경의 프라이버시 리스크 대응을 위한 개념 모델 제안\u003c/h1>\n\u003cp>\u003ca href=\"#README.md\">위키 홈\u003c/a> · \u003ca href=\"#literature.md\">논문 목록\u003c/a>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>항목\u003c/th>\n\u003cth>내용\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>저자\u003c/td>\n\u003ctd>장재영; 김범수; 이중엽\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>발행연도\u003c/td>\n\u003ctd>2025\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>학술지·공개처\u003c/td>\n\u003ctd>지식경영연구 26(2), 23–42\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DOI\u003c/td>\n\u003ctd>10.15813/kmr.2025.26.2.002\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>연구 방식\u003c/td>\n\u003ctd>개념 모델\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>실제 확인 범위\u003c/td>\n\u003ctd>KCI 초록\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>확인일\u003c/td>\n\u003ctd>2026-10-31\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/tab 174\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DOI\u003c/td>\n\u003ctd>10.15813/kmr.2025.26.3.008\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>연구 방식\u003c/td>\n\u003ctd>실증\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>실제 확인 범위\u003c/td>\n\u003ctd>KCI 초록·권호 페이지\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>확인일\u003c/td>\n\u003ctd>2026-10-31\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>확인한 내용\u003c/h2>\n\u003cp>의료·금융 맥락의 인간·AI 선호 차이와 지각된 신뢰성의 매개 역할을 분석했다. \u003ca href=\"https://www.kci.go.kr/kciportal/landing/article.kci?arti_id=ART003248132\">출처 확인\u003c/a>\u003c/p>\n\u003ch2>아이디어에 적용할 점 — 조사자의 해석\u003c/h2>\n\u003cp>서비스 영역과 고객의 사람 연결 선택을 설계 변수로 둔다.\u003c/p>\n\u003ch2>한계와 원문 확인 사항\u003c/h2>\n\u003cp>실제 진료·금융 성과 검증이 아니며 해당 영역의 자동 의사결정을 정당화하지 않는다. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\u003c/p>\n\u003ch2>연결된 아이디어\u003c/h2>\n\u003cp>\u003ca href=\"#ideas/I01.md\">I01\u003c/a> · \u003ca href=\"#ideas/I05.md\">I05\u003c/a> · \u003ca href=\"#ideas/I06.md\">I06\u003c/a>\u003c/p>\n"}, {"id": "papers/P24.md", "title": "P24 · 온라인 쇼핑몰 챗봇 사용자의 활용의도에 영향을 미치는 요인에 대한 실증 연구", "text": "# P24 · 온라인 쇼핑몰 챗봇 사용자의 활용의도에 영향을 미치는 요인에 대한 실증 연구\n\n[위키 홈](../README.md) · [논문 목록](../literature.md)\n\n| 항목 | 내용 |\n|---|---|\n| 저자 | 김태하 외 |\n| 발행연도 | 2020 |\n| 학술지·공개처 | 지식경영연구 21(4), 211–225 |\n| DOI | 10.15813/kmr.2020.21.4.011 |\n| 연구 방식 | 설문·회귀분석 |\n| 실제 확인 범위 | KCI 초록·서지 |\n| 확인일 | 2026-10-31 |\n\n## 확인한 내용\n\n300부 설문에서 개인화·지능성·사회적 실재감·개인정보 위험과 활용 의도의 관계를 분석했다. 응대 정확성은 축소·포기 의도와 관련됐다. [출처 확인](https://www.kci.go.kr/kciportal/landing/article.kci?arti_id=ART002668293)\n\n## 아이디어에 적용할 점 — 조사자의 해석\n\n사용 의향뿐 아니라 포기·이탈과 정확성을 평가.\n\n## 한계와 원문 확인 사항\n\n생성형 AI 이전 챗봇 연구이며 전체 공저자 표기는 제출용 원문에서 추가 확인. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\n\n## 연결된 아이디어\n\n[I01](../ideas/I01.md) · [I03](../ideas/I03.md) · [I07](../ideas/I07.md)\n", "html": "\u003ch1>P24 · 온라인 쇼핑몰 챗봇 사용자의 활용의도에 영향을 미치는 요인에 대한 실증 연구\u003c/h1>\n\u003cp>\u003ca href=\"#README.md\">위키 홈\u003c/a> · \u003ca href=\"#literature.md\">논문 목록\u003c/a>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>항목\u003c/th>\n\u003cth>내용\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>저자\u003c/td>\n\u003ctd>김태하 외\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>발행연도\u003c/td>\n\u003ctd>2020\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>학술지·공개처\u003c/td>\n\u003ctd>지식경영연구 21(4), 211–225\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DOI\u003c/td>\n\u003ctd>10.15813/kmr.2020.21.4.011\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>연구 방식\u003c/td>\n\u003ctd>설문·회귀분석\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>실제 확인 범위\u003c/td>\n\u003ctd>KCI 초록·서지\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>확인일\u003c/td>\n\u003ctd>2026-10-31\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>확인한 내용\u003c/h2>\n\u003cp>300부 설문에서 개인화·지능성·사회적 실재감·개인정보 위험과 활용 의도의 관계를 분석했다. 응대 정확성은 축소·포기 의도와 관련됐다. \u003ca href=\"https://www.kci.go.kr/kciportal/landing/article.kci?arti_id=ART002668293\">출처 확인\u003c/a>\u003c/p>\n\u003ch2>아이디어에 적용할 점 — 조사자의 해석\u003c/h2>\n\u003cp>사용 의향뿐 아니라 포기·이탈과 정확성을 평가.\u003c/p>\n\u003ch2>한계와 원문 확인 사항\u003c/h2>\n\u003cp>생성형 AI 이전 챗봇 연구이며 전체 공저자 표기는 제출용 원문에서 추가 확인. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\u003c/p>\n\u003ch2>연결된 아이디어\u003c/h2>\n\u003cp>\u003ca href=\"#ideas/I01.md\">I01\u003c/a> · \u003ca href=\"#ideas/I03.md\">I03\u003c/a> · \u003ca href=\"#ideas/I07.md\">I07\u003c/a>\u003c/p>\n"}, {"id": "papers/P25.md", "title": "P25 · 의료서비스 실패 유형에 따른 서비스 회복 공정성이 고객 만족 및 장기 관계 지향성에 미치는 영향: 다중집단분석을 활용하여", "text": "# P25 · 의료서비스 실패 유형에 따른 서비스 회복 공정성이 고객 만족 및 장기 관계 지향성에 미치는 영향: 다중집단분석을 활용하여\n\n[위키 홈](../README.md) · [논문 목록](../literature.md)\n\n| 항목 | 내용 |\n|---|---|\n| 저자 | 조성찬; 이훈영 |\n| 발행연도 | 2017 |\n| 학술지·공개처 | 의료경영학연구 11(2), 27–39 |\n| DOI | 10.18014/hsmr.2017.11.2.27 |\n| 연구 방식 | 실증 연구 |\n| 실제 확인 범위 | KCI 초록 |\n| 확인일 | 2026-10-31 |\n\n## 확인한 내용\n\n의료서비스 실패 유형, 회복 공정성, 고객 만족 및 장기 관계 지향성의 관계를 연구한다. [출처 확인](https://www.kci.go.kr/kciportal/landing/article.kci?arti_id=ART002239935)\n\n## 아이디어에 적용할 점 — 조사자의 해석\n\n병원 행정 안내를 다룰 경우 대우·절차의 공정성을 평가하는 보조 문헌.\n\n## 한계와 원문 확인 사항\n\n확인한 초록에 세부 계수와 표본이 없어 특정 효과가 입증됐다고 쓰지 않는다. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\n\n## 연결된 아이디어\n\n[I05](../ideas/I05.md)\n", "html": "\u003ch1>P25 · 의료서비스 실패 유형에 따른 서비스 회복 공정성이 고객 만족 및 장기 관계 지향성에 미치는 영향: 다중집단분석을 활용하여\u003c/h1>\n\u003cp>\u003ca href=\"#README.md\">위키 홈\u003c/a> · \u003ca href=\"#literature.md\">논문 목록\u003c/a>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>항목\u003c/th>\n\u003cth>내용\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>저자\u003c/td>\n\u003ctd>조성찬; 이훈영\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>발행연도\u003c/td>\n\u003ctd>2017\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>학술지·공개처\u003c/td>\n\u003ctd>의료경영학연구 11(2), 27–39\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DOI\u003c/td>\n\u003ctd>10.18014/hsmr.2017.11.2.27\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>연구 방식\u003c/td>\n\u003ctd>실증 연구\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>실제 확인 범위\u003c/td>\n\u003ctd>KCI 초록\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>확인일\u003c/td>\n\u003ctd>2026-10-31\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>확인한 내용\u003c/h2>\n\u003cp>의료서비스 실패 유형, 회복 공정성, 고객 만족 및 장기 관계 지향성의 관계를 연구한다. \u003ca href=\"https://www.kci.go.kr/kciportal/landing/article.kci?arti_id=ART002239935\">출처 확인\u003c/a>\u003c/p>\n\u003ch2>아이디어에 적용할 점 — 조사자의 해석\u003c/h2>\n\u003cp>병원 행정 안내를 다룰 경우 대우·절차의 공정성을 평가하는 보조 문헌.\u003c/p>\n\u003ch2>한계와 원문 확인 사항\u003c/h2>\n\u003cp>확인한 초록에 세부 계수와 표본이 없어 특정 효과가 입증됐다고 쓰지 않는다. 표본 모집, 측정 문항, 효과크기, 통계표를 확인하지 않은 경우 제출 문서에 만들어 넣지 않는다.\u003c/p>\n\u003ch2>연결된 아이디어\u003c/h2>\n\u003cp>\u003ca href=\"#ideas/I05.md\">I05\u003c/a>\u003c/p>\n"}, {"id": "research-log.md", "title": "검색 방법·범위·한계", "text": "# 검색 방법·범위·한계\n\n[위키 홈](README.md) · [논문 목록](literature.md)\n\n## 무엇을 수행했는가\n\n2026-10-31에 공개 웹 검색, 출판사·학회·KCI 논문 페이지, 저자 소속기관 자료, 공개 arXiv·ACL 자료를 교차 탐색했다. 학회와 고객 경험의 접점을 찾기 위한 심층 탐색형 문헌 조사다. 별도 Deep Research 전용 제품을 실행한 것이 아니며 PRISMA 전수 검색·체계적 문헌고찰을 완료했다고 주장하지 않는다.\n\n‘논문들 다 찾아봐’라는 요청은 관련 축을 넓게 찾는 것으로 해석했다. 모든 데이터베이스의 관련 논문을 빠짐없이 확보한 것은 아니다. 최종 선정은 25편이며 국내 10편 중 9편이 지식경영연구다. 전체 검색 결과의 중복 제거 전 건수를 완전한 로그로 보존하지 않았으므로 검색 총 건수·탈락률을 제시하지 않는다.\n\n## 검색 축과 실제 사용한 대표 검색어\n\n| 축 | 검색어 예시 | 채택 기준 |\n|---|---|---|\n| 공지 식별 | kmsk.or.kr 212 Notice; 한국지식경영학회 2026 공모전 | 공식 원문·대학 기록 우선 |\n| 학회 직접 문헌 | site:kci.go.kr 지식경영연구 챗봇 신뢰; 고객경험; 생성형 AI 서비스 | 고객·직원·지식 관리 연결 |\n| 고객 여정 | Understanding Customer Experience Throughout the Customer Journey | 널리 쓰이는 개념 틀 |\n| 현장 AI 효과 | Generative AI at Work; Experimental evidence productivity generative AI | 실증 맥락과 측정 가능한 성과 |\n| 부정 경험·반례 | Blame the Bot; human AI combinations meta analysis | 아이디어가 실패할 조건 |\n| 지식경영 | Nonaka dynamic theory; Alavi Leidner knowledge management; customer knowledge management Gibbert | 기록→공유→활용의 이론 |\n| 포용·신뢰 | 지식경영연구 시니어; 프라이버시; 인간 AI 에이전트 | 대상자·신뢰의 국내 근거 |\n| 구현·평가 | RAG; Lost in the Middle; tau-bench; tau2-bench | 근거 검색·상태 검증·실패 평가 |\n| 기존 사례 | KCS; Intercom Fin handoff; Hilton Digital Key; Starbucks Inclusive Spaces | 기능 중복과 운영 원칙 |\n\n## 포함·제외 원칙\n\n서지와 관련 내용을 확인할 수 있고 후보의 문제·메커니즘·구현·반례를 뒷받침하는 문헌을 포함했다. 검색에 나온 블로그·재판매 페이지·일반 AI 동향은 핵심 논문 근거에서 제외했다. 공개 전문을 내려받지 못한 자료는 초록 수준으로 표시했다. 논문 원문 파일의 일괄 다운로드는 하지 않았다.\n\n출판 연도는 검색엔진의 ‘몇 개월 전’ 표시보다 권호·DOI 기록을 우선했다. P09와 P10은 선게재 연도와 권호 연도가 다르다. P07은 최종 출판본의 5,172명·15%를 사용했다. 2026년 문헌도 탐색했지만 추천안을 직접 뒷받침하는 2020~2025년 연구와 고전 이론을 우선 선정했다. 최신 연구를 망라했다는 의미는 아니다.\n\n## 근거의 강도\n\n- 현장 도입·무작위 실험: 해당 업무와 표본에서의 효과 근거. 다른 업종으로의 전이는 가설이다.\n- 설문·리뷰 분석: 관련성과 인식의 근거. 제품 도입의 인과적 효과는 아니다.\n- 개념·리뷰: 설계와 연구 질문을 정리하는 틀. 성능 보장은 아니다.\n- 기술 벤치마크: 재현 가능한 기술 평가 아이디어. 실제 고객 만족과 구별한다.\n- 기업 문서: 기능·운영 방법의 존재 확인. 독립적인 효과 평가가 아니다.\n\n## 남은 확인 과제\n\n1. 공지 원문: 대회 조건을 확인하지 못한 상태다.\n2. 핵심 원문: P16·P17·P19·P20·P23의 표본, 측정 문항, 통계표를 확인한다.\n3. 추가 국내 문헌: ‘고객 노력 상담 이관’, ‘서비스 회복 지식 공유’, ‘인간-AI 협업 상담사 라포’ 등으로 RISS·KCI·학회지를 확장한다.\n4. 신규성: I01의 고객 확인형 인계와 가장 가까운 논문·특허·경쟁 기능을 추가 비교한다. 세계 최초를 주장하지 않는다.\n5. 데이터·시장: 협력 매장·상담조직, 실제 참여자, 지불 의사와 운영 부담을 확인한다.\n\n## 위키 갱신 규칙\n\n새 문헌은 DOI 또는 정확한 제목·저자로 중복 확인한다. 카드의 확인 범위와 확인일을 갱신하고, 원문에서 반대 결과가 발견되면 아이디어의 판단도 고친다. 검증 전 기대 효과와 실제 실험 결과를 같은 문장에 섞지 않는다.\n", "html": "\u003ch1>검색 방법·범위·한계\u003c/h1>\n\u003cp>\u003ca href=\"#README.md\">위키 홈\u003c/a> · \u003ca href=\"#literature.md\">논문 목록\u003c/a>\u003c/p>\n\u003ch2>무엇을 수행했는가\u003c/h2>\n\u003cp>2026-10-31에 공개 웹 검색, 출판사·학회·KCI 논문 페이지, 저자 소속기관 자료, 공개 arXiv·ACL 자료를 교차 탐색했다. 학회와 고객 경험의 접점을 찾기 위한 심층 탐색형 문헌 조사다. 별도 Deep Research 전용 제품을 실행한 것이 아니며 PRISMA 전수 검색·체계적 문헌고찰을 완료했다고 주장하지 않는다.\u003c/p>\n\u003cp>‘논문들 다 찾아봐’라는 요청은 관련 축을 넓게 찾는 것으로 해석했다. 모든 데이터베이스의 관련 논문을 빠짐없이 확보한 것은 아니다. 최종 선정은 25편이며 국내 10편 중 9편이 지식경영연구다. 전체 검색 결과의 중복 제거 전 건수를 완전한 로그로 보존하지 않았으므로 검색 총 건수·탈락률을 제시하지 않는다.\u003c/p>\n\u003ch2>검색 축과 실제 사용한 대표 검색어\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>축\u003c/th>\n\u003cth>검색어 예시\u003c/th>\n\u003cth>채택 기준\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>공지 식별\u003c/td>\n\u003ctd>kmsk.or.kr 212 Notice; 한국지식경영학회 2026 공모전\u003c/td>\n\u003ctd>공식 원문·대학 기록 우선\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>학회 직접 문헌\u003c/td>\n\u003ctd>site:kci.go.kr 지식경영연구 챗봇 신뢰; 고객경험; 생성형 AI 서비스\u003c/td>\n\u003ctd>고객·직원·지식 관리 연결\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>고객 여정\u003c/td>\n\u003ctd>Understanding Customer Experience Throughout the Customer Journey\u003c/td>\n\u003ctd>널리 쓰이는 개념 틀\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>현장 AI 효과\u003c/td>\n\u003ctd>Generative AI at Work; Experimental evidence productivity generative AI\u003c/td>\n\u003ctd>실증 맥락과 측정 가능한 성과\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>부정 경험·반례\u003c/td>\n\u003ctd>Blame the Bot; human AI combinations meta analysis\u003c/td>\n\u003ctd>아이디어가 실패할 조건\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>지식경영\u003c/td>\n\u003ctd>Nonaka dynamic theory; Alavi Leidner knowledge management; customer knowledge management Gibbert\u003c/td>\n\u003ctd>기록→공유→활용의 이론\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>포용·신뢰\u003c/td>\n\u003ctd>지식경영연구 시니어; 프라이버시; 인간 AI 에이전트\u003c/td>\n\u003ctd>대상자·신뢰의 국내 근거\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>구현·평가\u003c/td>\n\u003ctd>RAG; Lost in the Middle; tau-bench; tau2-bench\u003c/td>\n\u003ctd>근거 검색·상태 검증·실패 평가\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>기존 사례\u003c/td>\n\u003ctd>KCS; Intercom Fin handoff; Hilton Digital Key; Starbucks Inclusive Spaces\u003c/td>\n\u003ctd>기능 중복과 운영 원칙\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>포함·제외 원칙\u003c/h2>\n\u003cp>서지와 관련 내용을 확인할 수 있고 후보의 문제·메커니즘·구현·반례를 뒷받침하는 문헌을 포함했다. 검색에 나온 블로그·재판매 페이지·일반 AI 동향은 핵심 논문 근거에서 제외했다. 공개 전문을 내려받지 못한 자료는 초록 수준으로 표시했다. 논문 원문 파일의 일괄 다운로드는 하지 않았다.\u003c/p>\n\u003cp>출판 연도는 검색엔진의 ‘몇 개월 전’ 표시보다 권호·DOI 기록을 우선했다. P09와 P10은 선게재 연도와 권호 연도가 다르다. P07은 최종 출판본의 5,172명·15%를 사용했다. 2026년 문헌도 탐색했지만 추천안을 직접 뒷받침하는 2020~2025년 연구와 고전 이론을 우선 선정했다. 최신 연구를 망라했다는 의미는 아니다.\u003c/p>\n\u003ch2>근거의 강도\u003c/h2>\n\u003cul>\n\u003cli>현장 도입·무작위 실험: 해당 업무와 표본에서의 효과 근거. 다른 업종으로의 전이는 가설이다.\u003c/li>\n\u003cli>설문·리뷰 분석: 관련성과 인식의 근거. 제품 도입의 인과적 효과는 아니다.\u003c/li>\n\u003cli>개념·리뷰: 설계와 연구 질문을 정리하는 틀. 성능 보장은 아니다.\u003c/li>\n\u003cli>기술 벤치마크: 재현 가능한 기술 평가 아이디어. 실제 고객 만족과 구별한다.\u003c/li>\n\u003cli>기업 문서: 기능·운영 방법의 존재 확인. 독립적인 효과 평가가 아니다.\u003c/li>\n\u003c/ul>\n\u003ch2>남은 확인 과제\u003c/h2>\n\u003col>\n\u003cli>공지 원문: 대회 조건을 확인하지 못한 상태다.\u003c/li>\n\u003cli>핵심 원문: P16·P17·P19·P20·P23의 표본, 측정 문항, 통계표를 확인한다.\u003c/li>\n\u003cli>추가 국내 문헌: ‘고객 노력 상담 이관’, ‘서비스 회복 지식 공유’, ‘인간-AI 협업 상담사 라포’ 등으로 RISS·KCI·학회지를 확장한다.\u003c/li>\n\u003cli>신규성: I01의 고객 확인형 인계와 가장 가까운 논문·특허·경쟁 기능을 추가 비교한다. 세계 최초를 주장하지 않는다.\u003c/li>\n\u003cli>데이터·시장: 협력 매장·상담조직, 실제 참여자, 지불 의사와 운영 부담을 확인한다.\u003c/li>\n\u003c/ol>\n\u003ch2>위키 갱신 규칙\u003c/h2>\n\u003cp>새 문헌은 DOI 또는 정확한 제목·저자로 중복 확인한다. 카드의 확인 범위와 확인일을 갱신하고, 원문에서 반대 결과가 발견되면 아이디어의 판단도 고친다. 검증 전 기대 효과와 실제 실험 결과를 같은 문장에 섞지 않는다.\u003c/p>\n"}, {"id": "validation.md", "title": "추천안 검증과 실행 계획", "text": "# 추천안 검증과 실행 계획\n\n[위키 홈](README.md) · [I01 상세](ideas/I01.md)\n\n아래 수량과 일정은 제안이며 실제 수행 결과가 아니다. 팀 규모·마감을 모르는 상태에서 3~4주 학생 프로젝트를 가정했다.\n\n## 연구 질문과 가설\n\nRQ1. 자동 요약만 제공할 때보다 고객 확인형 인계 카드가 반복 설명과 정보 누락을 줄이는가?\n\nRQ2. 검토된 예외 처리 지식을 제공하면 초보 담당자의 해결 정확도가 높아지는가?\n\nRQ3. 확인·검토에 드는 시간이 전체 처리 시간과 고객 노력을 오히려 늘리지는 않는가?\n\n이를 하나의 실험에 모두 넣으면 원인을 분리하기 어렵다. 첫 실험은 인계 카드 효과에 집중하고, 지식 재사용 효과는 후속 실험으로 분리한다. 이 구분은 [P11](papers/P11.md)의 협업 효과 이질성과 [P07](papers/P07.md)의 숙련도 차이를 고려한 설계다.\n\n## 1단계: 문제 인터뷰\n\n고객 6~10명, 상담·매장 업무 경험자 3~5명을 탐색적으로 인터뷰한다. 모집 가능성에 따라 조정하며 대표성 있는 시장조사로 주장하지 않는다.\n\n1. 가장 최근에 문의를 두 번 이상 설명한 상황을 처음부터 이야기해 달라.\n2. 어떤 정보가 다음 담당자에게 전달되지 않았는가?\n3. 원하는 결과와 실제 받은 해결은 무엇이었는가?\n4. 미리 작성된 요약 중 직접 고치고 싶은 항목은 무엇인가?\n5. 다른 직원에게 공유하지 않았으면 하는 정보는 무엇인가?\n6. 직원에게: 예외 처리를 판단할 때 매뉴얼·동료·기억 중 무엇을 썼는가?\n7. 직원에게: 그 사례를 남기는 데 어느 정도 시간이 들면 지속할 수 있는가?\n\n‘이 앱이 있으면 쓰겠어요?’보다 실제 사건과 비용을 묻는다. 인터뷰 기록에는 가명만 쓰고 재사용에 동의한 범위만 보관한다.\n\n## 2단계: 작은 사용성 파일럿\n\n12~18명 수준으로 카드 이해·과제 난이도·측정 가능성을 먼저 확인한다. 이 수는 효능을 입증하기 위한 검정력 계산 결과가 아니다. 본 실험 표본은 파일럿 분산과 최소 의미 있는 효과를 정한 뒤 산정한다.\n\n| 조건 | 제공 내용 | 통제할 것 |\n|---|---|---|\n| A | 원문 대화와 일반 이관 | 동일 정책·담당자 역할·과제 난이도 |\n| B | 원문 + 자동 요약 | 같은 모델·검색 자료 |\n| C | 원문 + 고객 확인형 구조화 인계 | B와 같은 정보·모델, 확인 단계만 다르게 |\n\n조건별 과제 배정은 무작위화하고, 반복 참여라면 과제·조건 순서를 균형 배치한다. 평가자는 가능하면 조건을 모르게 하고, 동일 실패 사건을 모든 조건에서 풀게 하지 않아 기억 효과를 줄인다. 참가자의 고객 역할과 상담 역할을 구분해 분석한다.\n\n## 측정 정의\n\n| 지표 | 조작적 정의 |\n|---|---|\n| 해결 성공률 | 시나리오의 정답 상태에 도달한 과제 수 / 전체 과제 수 |\n| 재설명 횟수 | 이미 제공한 핵심 사실을 다시 요청해 고객이 반복한 횟수 |\n| 핵심 정보 누락률 | 사람이 만든 필수 사실 목록에서 인계에 빠진 항목 수 / 전체 필수 항목 |\n| 정책 오류율 | 정책과 모순되는 안내·처리 수 / 전체 평가 안내·처리 수 |\n| 총 처리 시간 | 최초 문의부터 완료까지, 카드 확인 시간과 재작업을 포함 |\n| 고객 노력 | ‘문제를 해결하기 위해 많은 노력이 필요했다’ 등 탐색 문항을 일관된 척도로 측정 |\n| 검토 부담 | 담당자가 요약·지식 카드를 확인·수정한 시간 |\n\n고객 노력 문항은 이 단계에서는 탐색용이며 검증된 척도를 그대로 사용했다고 표현하지 않는다. 정식 연구에서는 원척도·한국어 번역 절차·신뢰도를 확인한다. 만족도만 높고 해결 정확도가 낮은 경우를 성공으로 분류하지 않는다.\n\n## 두 번째 실험: 지식 재사용\n\n인계 방식을 고정한 뒤 일반 매뉴얼과 승인된 예외 사례 위키를 비교한다. 초보·경험자 수준을 기록하고, 위키 작성에 사용하지 않은 신규 시나리오를 평가한다. AI 도움을 제거한 후속 과제를 넣으면 학습인지 단기 의존인지 구별할 수 있다.\n\n## 시제품의 최소 데이터 구조\n\n| 자료 | 필수 필드 | 공개 범위 |\n|---|---|---|\n| 인계 카드 | 문제, 고객 확인 사실, 이미 시도한 것, 미해결 사항, 원하는 결과, 원문 위치, 공유 선택 | 해당 사건 담당자 |\n| 정책 카드 | 정책 ID, 적용 조건, 예외, 담당자, 유효기간, 출처, 버전 | 승인된 서비스 범위 |\n| 해결 지식 | 익명 상황, 적용 정책 버전, 시도, 실패 이유, 성공 조치, 적용 금지 조건, 검토자, 검토일 | 권한 있는 운영자 |\n| 평가 기록 | 시나리오 ID, 조건, 최종 상태, 오류 유형, 시간, 평가자 | 연구팀 |\n\n개인 사건을 그대로 공용 위키에 복사하지 않는다. RAG와 검토 흐름은 [P12](papers/P12.md)·[P19](papers/P19.md), 최종 상태와 반복 평가 개념은 [P14](papers/P14.md)·[P15](papers/P15.md)를 참고한다.\n\n## 4주 실행 예시\n\n| 주차 | 결과물 |\n|---|---|\n| 1 | 공지 확인, 핵심 논문 원문 확인, 인터뷰, 한 업종으로 범위 확정 |\n| 2 | 정책 10개·사례 30개·평가 과제 구축, 인계 카드 프로토타입 |\n| 3 | 파일럿과 오류 수정, 조건별 비교 실행 |\n| 4 | 결과·실패 사례 분석, 사업 가설 인터뷰, 발표 자료 작성 |\n\n## 발표에서 보여줄 것\n\n실제 고객 문제 한 장, 기존 방식과 개선 흐름 한 장, 논문 근거와 반례 한 장, 지식 흐름 한 장, 비교 실험과 결과 한 장, 경쟁 기능과 차이 한 장, 구매자와 운영 비용 한 장을 기본으로 잡는다. 실제 결과가 없으면 ‘기대 효과’와 ‘검증 계획’으로 명시한다.\n\n## 계속할지 결정하는 기준\n\n고객 확인이 누락·오류·노력을 줄이는지, 추가 시간이 감당 가능한지, 직원이 지식을 실제로 재사용하는지 확인한다. 개선이 없으면 카드 항목을 줄이거나 I02처럼 직원 측 문제로 범위를 바꾼다. 수치 기준은 파일럿 전에 팀이 정하고 결과를 본 뒤 유리하게 바꾸지 않는다.\n", "html": "\u003ch1>추천안 검증과 실행 계획\u003c/h1>\n\u003cp>\u003ca href=\"#README.md\">위키 홈\u003c/a> · \u003ca href=\"#ideas/I01.md\">I01 상세\u003c/a>\u003c/p>\n\u003cp>아래 수량과 일정은 제안이며 실제 수행 결과가 아니다. 팀 규모·마감을 모르는 상태에서 3~4주 학생 프로젝트를 가정했다.\u003c/p>\n\u003ch2>연구 질문과 가설\u003c/h2>\n\u003cp>RQ1. 자동 요약만 제공할 때보다 고객 확인형 인계 카드가 반복 설명과 정보 누락을 줄이는가?\u003c/p>\n\u003cp>RQ2. 검토된 예외 처리 지식을 제공하면 초보 담당자의 해결 정확도가 높아지는가?\u003c/p>\n\u003cp>RQ3. 확인·검토에 드는 시간이 전체 처리 시간과 고객 노력을 오히려 늘리지는 않는가?\u003c/p>\n\u003cp>이를 하나의 실험에 모두 넣으면 원인을 분리하기 어렵다. 첫 실험은 인계 카드 효과에 집중하고, 지식 재사용 효과는 후속 실험으로 분리한다. 이 구분은 \u003ca href=\"#papers/P11.md\">P11\u003c/a>의 협업 효과 이질성과 \u003ca href=\"#papers/P07.md\">P07\u003c/a>의 숙련도 차이를 고려한 설계다.\u003c/p>\n\u003ch2>1단계: 문제 인터뷰\u003c/h2>\n\u003cp>고객 6~10명, 상담·매장 업무 경험자 3~5명을 탐색적으로 인터뷰한다. 모집 가능성에 따라 조정하며 대표성 있는 시장조사로 주장하지 않는다.\u003c/p>\n\u003col>\n\u003cli>가장 최근에 문의를 두 번 이상 설명한 상황을 처음부터 이야기해 달라.\u003c/li>\n\u003cli>어떤 정보가 다음 담당자에게 전달되지 않았는가?\u003c/li>\n\u003cli>원하는 결과와 실제 받은 해결은 무엇이었는가?\u003c/li>\n\u003cli>미리 작성된 요약 중 직접 고치고 싶은 항목은 무엇인가?\u003c/li>\n\u003cli>다른 직원에게 공유하지 않았으면 하는 정보는 무엇인가?\u003c/li>\n\u003cli>직원에게: 예외 처리를 판단할 때 매뉴얼·동료·기억 중 무엇을 썼는가?\u003c/li>\n\u003cli>직원에게: 그 사례를 남기는 데 어느 정도 시간이 들면 지속할 수 있는가?\u003c/li>\n\u003c/ol>\n\u003cp>‘이 앱이 있으면 쓰겠어요?’보다 실제 사건과 비용을 묻는다. 인터뷰 기록에는 가명만 쓰고 재사용에 동의한 범위만 보관한다.\u003c/p>\n\u003ch2>2단계: 작은 사용성 파일럿\u003c/h2>\n\u003cp>12~18명 수준으로 카드 이해·과제 난이도·측정 가능성을 먼저 확인한다. 이 수는 효능을 입증하기 위한 검정력 계산 결과가 아니다. 본 실험 표본은 파일럿 분산과 최소 의미 있는 효과를 정한 뒤 산정한다.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>조건\u003c/th>\n\u003cth>제공 내용\u003c/th>\n\u003cth>통제할 것\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>원문 대화와 일반 이관\u003c/td>\n\u003ctd>동일 정책·담당자 역할·과제 난이도\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>원문 + 자동 요약\u003c/td>\n\u003ctd>같은 모델·검색 자료\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>원문 + 고객 확인형 구조화 인계\u003c/td>\n\u003ctd>B와 같은 정보·모델, 확인 단계만 다르게\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>조건별 과제 배정은 무작위화하고, 반복 참여라면 과제·조건 순서를 균형 배치한다. 평가자는 가능하면 조건을 모르게 하고, 동일 실패 사건을 모든 조건에서 풀게 하지 않아 기억 효과를 줄인다. 참가자의 고객 역할과 상담 역할을 구분해 분석한다.\u003c/p>\n\u003ch2>측정 정의\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>지표\u003c/th>\n\u003cth>조작적 정의\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>해결 성공률\u003c/td>\n\u003ctd>시나리오의 정답 상태에 도달한 과제 수 / 전체 과제 수\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>재설명 횟수\u003c/td>\n\u003ctd>이미 제공한 핵심 사실을 다시 요청해 고객이 반복한 횟수\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>핵심 정보 누락률\u003c/td>\n\u003ctd>사람이 만든 필수 사실 목록에서 인계에 빠진 항목 수 / 전체 필수 항목\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>정책 오류율\u003c/td>\n\u003ctd>정책과 모순되는 안내·처리 수 / 전체 평가 안내·처리 수\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>총 처리 시간\u003c/td>\n\u003ctd>최초 문의부터 완료까지, 카드 확인 시간과 재작업을 포함\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>고객 노력\u003c/td>\n\u003ctd>‘문제를 해결하기 위해 많은 노력이 필요했다’ 등 탐색 문항을 일관된 척도로 측정\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>검토 부담\u003c/td>\n\u003ctd>담당자가 요약·지식 카드를 확인·수정한 시간\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>고객 노력 문항은 이 단계에서는 탐색용이며 검증된 척도를 그대로 사용했다고 표현하지 않는다. 정식 연구에서는 원척도·한국어 번역 절차·신뢰도를 확인한다. 만족도만 높고 해결 정확도가 낮은 경우를 성공으로 분류하지 않는다.\u003c/p>\n\u003ch2>두 번째 실험: 지식 재사용\u003c/h2>\n\u003cp>인계 방식을 고정한 뒤 일반 매뉴얼과 승인된 예외 사례 위키를 비교한다. 초보·경험자 수준을 기록하고, 위키 작성에 사용하지 않은 신규 시나리오를 평가한다. AI 도움을 제거한 후속 과제를 넣으면 학습인지 단기 의존인지 구별할 수 있다.\u003c/p>\n\u003ch2>시제품의 최소 데이터 구조\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>자료\u003c/th>\n\u003cth>필수 필드\u003c/th>\n\u003cth>공개 범위\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>인계 카드\u003c/td>\n\u003ctd>문제, 고객 확인 사실, 이미 시도한 것, 미해결 사항, 원하는 결과, 원문 위치, 공유 선택\u003c/td>\n\u003ctd>해당 사건 담당자\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>정책 카드\u003c/td>\n\u003ctd>정책 ID, 적용 조건, 예외, 담당자, 유효기간, 출처, 버전\u003c/td>\n\u003ctd>승인된 서비스 범위\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>해결 지식\u003c/td>\n\u003ctd>익명 상황, 적용 정책 버전, 시도, 실패 이유, 성공 조치, 적용 금지 조건, 검토자, 검토일\u003c/td>\n\u003ctd>권한 있는 운영자\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>평가 기록\u003c/td>\n\u003ctd>시나리오 ID, 조건, 최종 상태, 오류 유형, 시간, 평가자\u003c/td>\n\u003ctd>연구팀\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>개인 사건을 그대로 공용 위키에 복사하지 않는다. RAG와 검토 흐름은 \u003ca href=\"#papers/P12.md\">P12\u003c/a>·\u003ca href=\"#papers/P19.md\">P19\u003c/a>, 최종 상태와 반복 평가 개념은 \u003ca href=\"#papers/P14.md\">P14\u003c/a>·\u003ca href=\"#papers/P15.md\">P15\u003c/a>를 참고한다.\u003c/p>\n\u003ch2>4주 실행 예시\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>주차\u003c/th>\n\u003cth>결과물\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>공지 확인, 핵심 논문 원문 확인, 인터뷰, 한 업종으로 범위 확정\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>정책 10개·사례 30개·평가 과제 구축, 인계 카드 프로토타입\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>파일럿과 오류 수정, 조건별 비교 실행\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>결과·실패 사례 분석, 사업 가설 인터뷰, 발표 자료 작성\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>발표에서 보여줄 것\u003c/h2>\n\u003cp>실제 고객 문제 한 장, 기존 방식과 개선 흐름 한 장, 논문 근거와 반례 한 장, 지식 흐름 한 장, 비교 실험과 결과 한 장, 경쟁 기능과 차이 한 장, 구매자와 운영 비용 한 장을 기본으로 잡는다. 실제 결과가 없으면 ‘기대 효과’와 ‘검증 계획’으로 명시한다.\u003c/p>\n\u003ch2>계속할지 결정하는 기준\u003c/h2>\n\u003cp>고객 확인이 누락·오류·노력을 줄이는지, 추가 시간이 감당 가능한지, 직원이 지식을 실제로 재사용하는지 확인한다. 개선이 없으면 카드 항목을 줄이거나 I02처럼 직원 측 문제로 범위를 바꾼다. 수치 기준은 파일럿 전에 팀이 정하고 결과를 본 뒤 유리하게 바꾸지 않는다.\u003c/p>\n"}];const nav=document.getElementById('nav'),q=document.getElementById('q');
function list(){const s=q.value.trim().toLowerCase();const selected=pages.filter(p=>!s||p.text.toLowerCase().includes(s));nav.replaceChildren();document.getElementById('count').textContent=selected.length+'개 문서';selected.sort((a,b)=>(a.id==='README.md'?-1:b.id==='README.md'?1:a.id.localeCompare(b.id))).forEach(p=>{const a=document.createElement('a');a.href='#'+p.id;a.textContent=p.title;nav.append(a)})}
function show(){let id;try{id=decodeURIComponent(location.hash.slice(1))}catch{id='README.md'}const p=pages.find(p=>p.id===id)||pages.find(p=>p.id==='README.md');document.getElementById('content').innerHTML=p.html;document.title=p.title+' | KMSK 연구 위키';window.scrollTo(0,0)}q.addEventListener('input',list);addEventListener('hashchange',show);list();show();</script></html>
