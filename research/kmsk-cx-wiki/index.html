<script>const pages=[{"id": "README.md", "title": "한국지식경영학회 × 고객 경험 아이디어 연구 위키", "text": "# 한국지식경영학회 × 고객 경험 아이디어 연구 위키\n\n조사 기준일: **2026-10-31** · 논문 25편 · 아이디어 8개 · 추천안 3개\n\n**추천은 ‘고객이 다시 설명하지 않아도 되는 상담’이다.** 고객이 확인한 인계 정보를 다음 담당자에게 전달하고, 해결된 예외 사례를 검토해 조직의 지식으로 남긴다. 현장 매장과 협력할 수 있으면 ‘알바가 바뀌어도 서비스는 이어지는 매장 위키’가 실행 면에서 더 유리할 수 있다.\n\n사용자가 준 [공지 원문](http://www.kmsk.or.kr/Notice/view.asp?Key=212)은 접속 실패로 내용을 확인하지 못했다. **정확한 행사명·연도·주제·마감·자격·심사 기준은 미확인**이다. 이 위키는 학회 연구 범위와 관련 논문에 맞춘 탐색 결과이며 공모요강 적합성 확정본이 아니다.\n\n## 바로 읽기\n\n1. [공지 확인 상태와 학회 적합성](brief.md)\n2. [8개 아이디어 비교](ideas/ideas.md)\n3. [1순위: 고객 확인형 상담 인계](ideas/I01.md)\n4. [현장형: 매장 노하우 공유](ideas/I02.md)\n5. [포용형: 시니어 디지털 이용 지원](ideas/I03.md)\n6. [고객 경험 사례와 기존 서비스 비교](cases.md)\n7. [논문 25편 지도와 읽기 순서](literature.md)\n8. [추천안의 실험·인터뷰·실행 계획](validation.md)\n9. [검색 범위·한계·추가 조사](research-log.md)\n\n## 조사에서 얻은 판단\n\n고객에게 보이는 편리함과 내부 지식 흐름을 함께 설계하는 편이 이 학회와 연결하기 쉽다. 현장 AI 지원의 긍정적 결과([P07](papers/P07.md))와 부정 리뷰에서 인간 개입이 필요하다는 결과([P16](papers/P16.md))를 함께 고려했다. 협업이 항상 가장 좋은 성과를 내지는 않는다는 반례([P11](papers/P11.md))도 실험에 반영했다.\n\n‘AI가 잘 답한다’에서 한 걸음 더 나아가 **어떤 고객 상황을 누가 확인하고, 어떤 근거로 해결하고, 다음 담당자가 무엇을 재사용하는가**를 보여주는 것이 이 위키의 제안이다.\n\n## 자료 사용법\n\n각 논문 카드에는 서지·출처·실제 열람 범위·발견·적용·한계가 있다. ‘확인한 내용’은 출처의 주장이고 ‘적용’은 조사자의 제안이다. 링크된 원문을 확보해 통계표와 측정 문항을 확인한 뒤 제출 문서에 인용한다.\n\n검색 가능한 오프라인 열람판은 [index.html](index.html), 표 자료는 [papers.csv](papers.csv)다. 이 위키는 로컬 파일이며 외부 사이트에 게시되지 않았다.\n", "html": "\u003ch1>한국지식경영학회 × 고객 경험 아이디어 연구 위키\u003c/h1>\n\u003cp>조사 기준일: \u003cstrong>2026-10-31\u003c/strong> · 논문 25편 · 아이디어 8개 · 추천안 3개\u003c/p>\n\u003cp>\u003cstrong>추천은 ‘고객이 다시 설명하지 않아도 되는 상담’이다.\u003c/strong> 고객이 확인한 인계 정보를 다음 담당자에게 전달하고, 해결된 예외 사례를 검토해 조직의 지식으로 남긴다. 현장 매장과 협력할 수 있으면 ‘알바가 바뀌어도 서비스는 이어지는 매장 위키’가 실행 면에서 더 유리할 수 있다.\u003c/p>\n\u003cp>사용자가 준 \u003ca href=\"http://www.kmsk.or.kr/Notice/view.asp?Key=212\">공지 원문\u003c/a>은 접속 실패로 내용을 확인하지 못했다. \u003cstrong>정확한 행사명·연도·주제·마감·자격·심사 기준은 미확인\u003c/strong>이다. 이 위키는 학회 연구 범위와 관련 논문에 맞춘 탐색 결과이며 공모요강 적합성 확정본이 아니다.\u003c/p>\n\u003ch2>바로 읽기\u003c/h2>\n\u003col>\n\u003cli>\u003ca href=\"#brief.md\">공지 확인 상태와 학회 적합성\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#ideas/ideas.md\">8개 아이디어 비교\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#ideas/I01.md\">1순위: 고객 확인형 상담 인계\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#ideas/I02.md\">현장형: 매장 노하우 공유\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#ideas/I03.md\">포용형: 시니어 디지털 이용 지원\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#cases.md\">고객 경험 사례와 기존 서비스 비교\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#literature.md\">논문 25편 지도와 읽기 순서\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#validation.md\">추천안의 실험·인터뷰·실행 계획\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#research-log.md\">검색 범위·한계·추가 조사\u003c/a>\u003c/li>\n\u003c/ol>\n\u003ch2>조사에서 얻은 판단\u003c/h2>\n\u003cp>고객에게 보이는 편리함과 내부 지식 흐름을 함께 설계하는 편이 이 학회와 연결하기 쉽다. 현장 AI 지원의 긍정적 결과(\u003ca href=\"#papers/P07.md\">P07\u003c/a>)와 부정 리뷰에서 인간 개입이 필요하다는 결과(\u003ca href=\"#papers/P16.md\">P16\u003c/a>)를 함께 고려했다. 협업이 항상 가장 좋은 성과를 내지는 않는다는 반례(\u003ca href=\"#papers/P11.md\">P11\u003c/a>)도 실험에 반영했다.\u003c/p>\n\u003cp>‘AI가 잘 답한다’에서 한 걸음 더 나아가 \u003cstrong>어떤 고객 상황을 누가 확인하고, 어떤 근거로 해결하고, 다음 담당자가 무엇을 재사용하는가\u003c/strong>를 보여주는 것이 이 위키의 제안이다.\u003c/p>\n\u003ch2>자료 사용법\u003c/h2>\n\u003cp>각 논문 카드에는 서지·출처·실제 열람 범위·발견·적용·한계가 있다. ‘확인한 내용’은 출처의 주장이고 ‘적용’은 조사자의 제안이다. 링크된 원문을 확보해 통계표와 측정 문항을 확인한 뒤 제출 문서에 인용한다.\u003c/p>\n\u003cp>검색 가능한 오프라인 열람판은 \u003ca href=\"index.html\">index.html\u003c/a>, 표 자료는 \u003ca href=\"papers.csv\">papers.csv\u003c/a>다. 이 위키는 로컬 파일이며 외부 사이트에 게시되지 않았다.\u003c/p>\n"}, {"id": "brief.md", "title": "공지 확인 상태와 학회 적합성", "text": "# 공지 확인 상태와 학회 적합성\n\n[위키 홈](README.md)\n\n## 확인한 것과 확인하지 못한 것\n\n| 항목 | 상태 |\n|---|---|\n| 사용자 제공 링크 | http://www.kmsk.or.kr/Notice/view.asp?Key=212 |\n| 링크의 본문 | HTTP/HTTPS 및 www 유무를 바꿔도 확인 실패 |\n| 행사명·연도·마감·자격·주제·배점 | 미확인 |\n| 기관 | KCI 기관 정보에서 kmsk.or.kr을 한국지식경영학회 홈페이지로 확인 |\n| 학회 관심 범위 | 지식경영 관련 경험적·개념적 연구 및 기업 사례 |\n| 조사 판단 | 고객 경험과 지식 생성·공유·활용을 결합하는 방향이 적합할 가능성 |\n\n기관 및 학술지 범위의 출처: [KCI 학회 정보](https://www.kci.go.kr/kciportal/po/search/poInsiSearSoceView.kci?insiGeneInfoBean.insiId=INS000002048).\n\n## 학회와 직접 연결되는 연구 축\n\n| 연구 축 | 이 위키의 연결 | 학회 논문 |\n|---|---|---|\n| 고객서비스의 인간·AI 역할 | 부정 경험 이관, 사람이 판단할 구간 | [P16](papers/P16.md), [P23](papers/P23.md) |\n| 고객 지식과 분석 | 후기에서 문제를 찾아 개선 실행 | [P18](papers/P18.md) |\n| 디지털 포용과 신뢰 | 시니어가 도움 경로를 아는 경험 | [P17](papers/P17.md) |\n| 지식 검색과 생성 | 근거형 답변과 검색 평가 | [P19](papers/P19.md) |\n| 정보 품질·프라이버시 | 고객이 기억과 전달 범위를 선택 | [P20](papers/P20.md), [P22](papers/P22.md) |\n\n## 과거 행사에서 얻을 수 있는 제한적 단서\n\n2023년 공모전은 생성 AI 시대 지식경영 혁신을 주제로 진행됐다는 대학 공식 기록이 있다. 그 해 가상 심리상담 서비스의 수상 사례도 확인된다. 이미 비슷한 제안이 있었으므로 일반적인 ‘AI 상담’만으로 독창성을 주장하기 어렵다. [한국기술교육대학교 기록](https://www.koreatech.ac.kr/gallery.es?act=view&bid=0018&list_no=35094&mid=a10701020000), [국민대학교 기록](https://www.kookmin.ac.kr/comm/board/user/be8e117863cfd580d7ed5931a799207c/view.do?dataSeq=1075036).\n\n2025년 추계학술대회 주제는 ‘Agentic AI 시대, 안전한 정보와 지식’이었다는 공식 보도자료가 있다. 이는 과거 행사 정보이며 사용자가 준 Key=212 공지와 동일한 행사라는 근거는 없다. [한국재정정보원 보도자료](https://fis.kr/ko/notification/press_release?articleSeq=4704).\n\n## 공지 확보 후 확인할 체크포인트\n\n행사 주제와 연도, 참가 자격, 팀 인원, 실제 구현 필수 여부, 논문·사업계획서 형식, 데이터 사용 조건, 제출 마감, 심사 배점을 확인한다. 발표용 제안서의 분량과 일정은 그 뒤 확정한다.\n", "html": "\u003ch1>공지 확인 상태와 학회 적합성\u003c/h1>\n\u003cp>\u003ca href=\"#README.md\">위키 홈\u003c/a>\u003c/p>\n\u003ch2>확인한 것과 확인하지 못한 것\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>항목\u003c/th>\n\u003cth>상태\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>사용자 제공 링크\u003c/td>\n\u003ctd>http://www.kmsk.or.kr/Notice/view.asp?Key=212\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>링크의 본문\u003c/td>\n\u003ctd>HTTP/HTTPS 및 www 유무를 바꿔도 확인 실패\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>행사명·연도·마감·자격·주제·배점\u003c/td>\n\u003ctd>미확인\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>기관\u003c/td>\n\u003ctd>KCI 기관 정보에서 kmsk.or.kr을 한국지식경영학회 홈페이지로 확인\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>학회 관심 범위\u003c/td>\n\u003ctd>지식경영 관련 경험적·개념적 연구 및 기업 사례\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>조사 판단\u003c/td>\n\u003ctd>고객 경험과 지식 생성·공유·활용을 결합하는 방향이 적합할 가능성\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>기관 및 학술지 범위의 출처: \u003ca href=\"https://www.kci.go.kr/kciportal/po/search/poInsiSearSoceView.kci?insiGeneInfoBean.insiId=INS000002048\">KCI 학회 정보\u003c/a>.\u003c/p>\n\u003ch2>학회와 직접 연결되는 연구 축\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>연구 축\u003c/th>\n\u003cth>이 위키의 연결\u003c/th>\n\u003cth>학회 논문\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>고객서비스의 인간·AI 역할\u003c/td>\n\u003ctd>부정 경험 이관, 사람이 판단할 구간\u003c/td>\n\u003ctd>\u003ca href=\"#papers/P16.md\">P16\u003c/a>, \u003ca href=\"#papers/P23.md\">P23\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>고객 지식과 분석\u003c/td>\n\u003ctd>후기에서 문제를 찾아 개선 실행\u003c/td>\n\u003ctd>\u003ca href=\"#papers/P18.md\">P18\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>디지털 포용과 신뢰\u003c/td>\n\u003ctd>시니어가 도움 경로를 아는 경험\u003c/td>\n\u003ctd>\u003ca href=\"#papers/P17.md\">P17\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>지식 검색과 생성\u003c/td>\n\u003ctd>근거형 답변과 검색 평가\u003c/td>\n\u003ctd>\u003ca href=\"#papers/P19.md\">P19\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>정보 품질·프라이버시\u003c/td>\n\u003ctd>고객이 기억과 전달 범위를 선택\u003c/td>\n\u003ctd>\u003ca href=\"#papers/P20.md\">P20\u003c/a>, \u003ca href=\"#papers/P22.md\">P22\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>과거 행사에서 얻을 수 있는 제한적 단서\u003c/h2>\n\u003cp>2023년 공모전은 생성 AI 시대 지식경영 혁신을 주제로 진행됐다는 대학 공식 기록이 있다. 그 해 가상 심리상담 서비스의 수상 사례도 확인된다. 이미 비슷한 제안이 있었으므로 일반적인 ‘AI 상담’만으로 독창성을 주장하기 어렵다. \u003ca href=\"https://www.koreatech.ac.kr/gallery.es?act=view&amp;bid=0018&amp;list_no=35094&amp;mid=a10701020000\">한국기술교육대학교 기록\u003c/a>, \u003ca href=\"https://www.kookmin.ac.kr/comm/board/user/be8e117863cfd580d7ed5931a799207c/view.do?dataSeq=1075036\">국민대학교 기록\u003c/a>.\u003c/p>\n\u003cp>2025년 추계학술대회 주제는 ‘Agentic AI 시대, 안전한 정보와 지식’이었다는 공식 보도자료가 있다. 이는 과거 행사 정보이며 사용자가 준 Key=212 공지와 동일한 행사라는 근거는 없다. \u003ca href=\"https://fis.kr/ko/notification/press_release?articleSeq=4704\">한국재정정보원 보도자료\u003c/a>.\u003c/p>\n\u003ch2>공지 확보 후 확인할 체크포인트\u003c/h2>\n\u003cp>행사 주제와 연도, 참가 자격, 팀 인원, 실제 구현 필수 여부, 논문·사업계획서 형식, 데이터 사용 조건, 제출 마감, 심사 배점을 확인한다. 발표용 제안서의 분량과 일정은 그 뒤 확정한다.\u003c/p>\n"}, {"id": "cases.md", "title": "고객 경험 사례에서 가져올 설계 원칙", "text": "# 고객 경험 사례에서 가져올 설계 원칙\n\n[위키 홈](README.md) · [아이디어 비교](ideas/ideas.md)\n\n기업 공식 문서는 기능 존재를 확인하는 자료다. 독립적으로 검증한 만족도 상승이나 투자수익의 증거로 취급하지 않는다.\n\n| 사례 | 공식 자료에서 확인한 경험 | 가져올 원칙 | 관련 후보 |\n|---|---|---|---|\n| Hilton Digital Key | 앱에서 디지털 키를 받고 객실 등에 접근. 물리 키 선택도 가능하며 신원 확인을 위해 프런트 방문이 필요할 수 있음 | 전체 여정의 수고를 줄이되 예외와 사람 경로를 보존 | I01·I05·I06 |\n| Starbucks Inclusive Spaces Framework | 입구·이동 동선·주문 접점·감각 환경을 함께 고려하는 포용 설계 | 화면 크기뿐 아니라 이용 과정 전체와 도움 접근을 설계 | I03 |\n| Intercom Fin | 상담 이관 조건과 전달 방식 설정, 일부 흐름에서 사람의 입력·승인을 받는 기능 | 인계·사람 검토만으로는 새롭지 않음. 추가 가치의 실험 필요 | I01·I08 |\n| KCS | 업무에서 지식을 재사용·개선하고 필요할 때 기록하며 반복 패턴으로 조직 개선 | 문서 축적량보다 해결 과정에서의 재사용과 품질을 관리 | I02·I04 |\n\n출처: [Hilton 도움말](https://www.hilton.com/en/help-center/check-in-and-check-out/how-to-use-your-digital-key/), [Starbucks 2024 공식 자료](https://about.starbucks.com/uploads/2024/02/SBX20240215_Inclusive-Stores-One-Pager.pdf), [Intercom 이관 문서](https://www.intercom.com/help/en/articles/12396892-manage-fin-ai-agent-s-escalation-guidance-and-rules), [Intercom 사람 입력 기능](https://www.intercom.com/help/en/articles/16198358-ask-a-teammate-for-help-with-fin-s-replies-human-in-the-loop), [KCS 실무 원칙](https://library.serviceinnovation.org/KCS/Knowledge-Centered_Success_Practices_Guide/402-Purpose_Behind_the_Practices).\n\n## 아직 검증하지 않은 고객 경험 가설\n\n| 원하는 경험 | 지금 가정하는 불편 | 고객 인터뷰에서 확인할 것 |\n|---|---|---|\n| 다시 설명하지 않는다 | 상담 이관 시 맥락 유실 | 최근 사례에서 실제 몇 번 설명했고 무엇이 빠졌는가 |\n| 담당자가 바뀌어도 기준이 같다 | 예외 처리 노하우가 개인에게 집중 | 규정과 직원 경험 중 무엇에 의존했는가 |\n| 막혀도 스스로 이어간다 | 잘못 누른 뒤 복구·도움 경로가 불명확 | 어느 화면에서 포기했고 어떤 도움이 유효했는가 |\n| 내 불만이 개선으로 이어진다 | 사과 후 같은 불편 반복 | 실행된 개선을 확인한 경험과 재발 여부 |\n| 나에 대한 기억을 통제한다 | 개인화에 쓰인 정보가 불명확 | 기억시키고 싶은 항목과 지우고 싶은 항목 |\n\n이 표는 인터뷰에서 이미 확인한 사실이 아니다. 실제 사례를 모집해 빈도·심각도·대안 비용을 확인해야 한다.\n\n## 1순위 아이디어의 서비스 블루프린트\n\n| 단계 | 고객 행동 | 고객에게 보이는 응대 | 내부 업무 | 남는 지식 |\n|---|---|---|---|---|\n| 문의 | 문제·원하는 결과 입력 | 접수 확인 | 규정과 사례 검색 | 아직 개인별 사건 기록 |\n| 확인 | 핵심 사실 수정·공유 선택 | 사실/추정 구분 카드 | 누락 검증 | 확인된 인계 정보 |\n| 연결 | 담당자에게 이어서 요청 | 이미 확인한 내용 제시 | 담당·권한 확인 | 인계 사유 |\n| 해결 | 대안 선택·결과 확인 | 근거와 처리 상태 | 정책 범위 내 처리 | 조치와 결과 |\n| 학습 | 선택적 후기 | 개선 반영 여부 | 개인정보 제거·관리자 검토 | 재사용 가능한 예외 사례 |\n\n블루프린트 방식의 근거는 [P05](papers/P05.md). 위 흐름 자체는 이번 조사의 제안이다.\n", "html": "\u003ch1>고객 경험 사례에서 가져올 설계 원칙\u003c/h1>\n\u003cp>\u003ca href=\"#README.md\">위키 홈\u003c/a> · \u003ca href=\"#ideas/ideas.md\">아이디어 비교\u003c/a>\u003c/p>\n\u003cp>기업 공식 문서는 기능 존재를 확인하는 자료다. 독립적으로 검증한 만족도 상승이나 투자수익의 증거로 취급하지 않는다.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>사례\u003c/th>\n\u003cth>공식 자료에서 확인한 경험\u003c/th>\n\u003cth>가져올 원칙\u003c/th>\n\u003cth>관련 후보\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Hilton Digital Key\u003c/td>\n\u003ctd>앱에서 디지털 키를 받고 객실 등에 접근. 물리 키 선택도 가능하며 신원 확인을 위해 프런트 방문이 필요할 수 있음\u003c/td>\n\u003ctd>전체 여정의 수고를 줄이되 예외와 사람 경로를 보존\u003c/td>\n\u003ctd>I01·I05·I06\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Starbucks Inclusive Spaces Framework\u003c/td>\n\u003ctd>입구·이동 동선·주문 접점·감각 환경을 함께 고려하는 포용 설계\u003c/td>\n\u003ctd>화면 크기뿐 아니라 이용 과정 전체와 도움 접근을 설계\u003c/td>\n\u003ctd>I03\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Intercom Fin\u003c/td>\n\u003ctd>상담 이관 조건과 전달 방식 설정, 일부 흐름에서 사람의 입력·승인을 받는 기능\u003c/td>\n\u003ctd>인계·사람 검토만으로는 새롭지 않음. 추가 가치의 실험 필요\u003c/td>\n\u003ctd>I01·I08\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>KCS\u003c/td>\n\u003ctd>업무에서 지식을 재사용·개선하고 필요할 때 기록하며 반복 패턴으로 조직 개선\u003c/td>\n\u003ctd>문서 축적량보다 해결 과정에서의 재사용과 품질을 관리\u003c/td>\n\u003ctd>I02·I04\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>출처: \u003ca href=\"https://www.hilton.com/en/help-center/check-in-and-check-out/how-to-use-your-digital-key/\">Hilton 도움말\u003c/a>, \u003ca href=\"https://about.starbucks.com/uploads/2024/02/SBX20240215_Inclusive-Stores-One-Pager.pdf\">Starbucks 2024 공식 자료\u003c/a>, \u003ca href=\"https://www.intercom.com/help/en/articles/12396892-manage-fin-ai-agent-s-escalation-guidance-and-rules\">Intercom 이관 문서\u003c/a>, \u003ca href=\"https://www.intercom.com/help/en/articles/16198358-ask-a-teammate-for-help-with-fin-s-replies-human-in-the-loop\">Intercom 사람 입력 기능\u003c/a>, \u003ca href=\"https://library.serviceinnovation.org/KCS/Knowledge-Centered_Success_Practices_Guide/402-Purpose_Behind_the_Practices\">KCS 실무 원칙\u003c/a>.\u003c/p>\n\u003ch2>아직 검증하지 않은 고객 경험 가설\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>원하는 경험\u003c/th>\n\u003cth>지금 가정하는 불편\u003c/th>\n\u003cth>고객 인터뷰에서 확인할 것\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>다시 설명하지 않는다\u003c/td>\n\u003ctd>상담 이관 시 맥락 유실\u003c/td>\n\u003ctd>최근 사례에서 실제 몇 번 설명했고 무엇이 빠졌는가\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>담당자가 바뀌어도 기준이 같다\u003c/td>\n\u003ctd>예외 처리 노하우가 개인에게 집중\u003c/td>\n\u003ctd>규정과 직원 경험 중 무엇에 의존했는가\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>막혀도 스스로 이어간다\u003c/td>\n\u003ctd>잘못 누른 뒤 복구·도움 경로가 불명확\u003c/td>\n\u003ctd>어느 화면에서 포기했고 어떤 도움이 유효했는가\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>내 불만이 개선으로 이어진다\u003c/td>\n\u003ctd>사과 후 같은 불편 반복\u003c/td>\n\u003ctd>실행된 개선을 확인한 경험과 재발 여부\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>나에 대한 기억을 통제한다\u003c/td>\n\u003ctd>개인화에 쓰인 정보가 불명확\u003c/td>\n\u003ctd>기억시키고 싶은 항목과 지우고 싶은 항목\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>이 표는 인터뷰에서 이미 확인한 사실이 아니다. 실제 사례를 모집해 빈도·심각도·대안 비용을 확인해야 한다.\u003c/p>\n\u003ch2>1순위 아이디어의 서비스 블루프린트\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>단계\u003c/th>\n\u003cth>고객 행동\u003c/th>\n\u003cth>고객에게 보이는 응대\u003c/th>\n\u003cth>내부 업무\u003c/th>\n\u003cth>남는 지식\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>문의\u003c/td>\n\u003ctd>문제·원하는 결과 입력\u003c/td>\n\u003ctd>접수 확인\u003c/td>\n\u003ctd>규정과 사례 검색\u003c/td>\n\u003ctd>아직 개인별 사건 기록\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>확인\u003c/td>\n\u003ctd>핵심 사실 수정·공유 선택\u003c/td>\n\u003ctd>사실/추정 구분 카드\u003c/td>\n\u003ctd>누락 검증\u003c/td>\n\u003ctd>확인된 인계 정보\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>연결\u003c/td>\n\u003ctd>담당자에게 이어서 요청\u003c/td>\n\u003ctd>이미 확인한 내용 제시\u003c/td>\n\u003ctd>담당·권한 확인\u003c/td>\n\u003ctd>인계 사유\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>해결\u003c/td>\n\u003ctd>대안 선택·결과 확인\u003c/td>\n\u003ctd>근거와 처리 상태\u003c/td>\n\u003ctd>정책 범위 내 처리\u003c/td>\n\u003ctd>조치와 결과\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>학습\u003c/td>\n\u003ctd>선택적 후기\u003c/td>\n\u003ctd>개선 반영 여부\u003c/td>\n\u003ctd>개인정보 제거·관리자 검토\u003c/td>\n\u003ctd>재사용 가능한 예외 사례\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>블루프린트 방식의 근거는 \u003ca href=\"#papers/P05.md\">P05\u003c/a>. 위 흐름 자체는 이번 조사의 제안이다.\u003c/p>\n"}, {"id": "ideas/I01.md", "title": "I01 · 다시 설명하지 않아도 되는 고객 상담", "text": "# I01 · 다시 설명하지 않아도 되는 고객 상담\n\n고객 확인형 인계 카드와 서비스 회복 지식 위키\n\n[위키 홈](../README.md) · [후보 비교](ideas.md) · [검증 계획](../validation.md)\n\n## 고객과 해결할 문제\n\n환불·교환 상담 중 챗봇, 직원, 다른 부서로 이동하며 사정을 반복하는 고객.\n\n## 만들고 싶은 고객 경험\n\n이미 한 시도와 원하는 해결을 한 번 확인하면 다음 담당자가 이어서 해결한다.\n\n## 고객 여정\n\n고객이 문의 → AI가 사실·시도·미해결·요청을 구분 → 고객이 수정·공유 선택 → 사람이 처리 → 확인된 해결 사례만 지식 위키에 반영.\n\n## 지식경영 기여\n\n고객 확인·수정이 가능한 인계 카드, 원문 근거 연결, 정책 버전, 실패한 조치, 해결 여부를 같이 기록한다.\n\n## 기존 서비스와의 차이 — 검증 전 가설\n\n상담 이관·요약·사람 검토는 Intercom 등에 이미 있다. 차별화 가설은 고객의 인계 정보 통제와 예외 처리 지식의 품질 관리가 추가로 도움이 되는지다.\n\n## 학생 팀의 최소 구현\n\n가상의 온라인 학회 굿즈숍에서 주문 오류·교환·배송 지연 3유형, 정책 10개, 사례 30개로 데모. 실제 결제 없이 처리 상태만 변경.\n\n## 검증 실험과 지표\n\n일반 이관 / 자동 요약 / 고객 확인형 구조화 인계 3조건. 같은 문의 난이도로 재설명 횟수·오류·고객 노력·해결 시간을 비교.\n\n측정 지표: 반복 설명 수, 핵심 정보 누락률, 정책 오류율, 해결 성공률, 총 처리 시간, 고객 노력.\n\n## 고객과 사업성 가설\n\n국내 소규모 쇼핑몰 고객지원팀에 월 구독을 받는 B2B 가설. 비용 절감은 상담량×절약 시간×인건비로 추정하되 실측 전 수치를 매출처럼 제시하지 않는다.\n\n## 취약점·중단 조건\n\n고객 확인 단계가 더 번거로울 수 있고 오류가 인계되면 피해가 확대된다. 확인은 핵심 항목만, 원문 링크·정정 이력·즉시 사람 연결을 제공. 기존 방식보다 핵심 성과가 좋아지지 않거나 추가 운영 부담이 편익을 넘으면 범위를 줄이거나 다른 후보를 선택한다.\n\n## 논문 근거\n\n[P04](../papers/P04.md) · [P06](../papers/P06.md) · [P07](../papers/P07.md) · [P09](../papers/P09.md) · [P11](../papers/P11.md) · [P12](../papers/P12.md) · [P13](../papers/P13.md) · [P16](../papers/P16.md) · [P19](../papers/P19.md) · [P20](../papers/P20.md) · [P22](../papers/P22.md) · [P23](../papers/P23.md) · [P24](../papers/P24.md)\n\n위 논문들은 문제와 설계의 근거다. 이 아이디어의 성과나 독창성을 이미 입증한 것은 아니다.\n", "html": "\u003ch1>I01 · 다시 설명하지 않아도 되는 고객 상담\u003c/h1>\n\u003cp>고객 확인형 인계 카드와 서비스 회복 지식 위키\u003c/p>\n\u003cp>\u003ca href=\"#README.md\">위키 홈\u003c/a> · \u003ca href=\"#ideas/ideas.md\">후보 비교\u003c/a> · \u003ca href=\"#validation.md\">검증 계획\u003c/a>\u003c/p>\n\u003ch2>고객과 해결할 문제\u003c/h2>\n\u003cp>환불·교환 상담 중 챗봇, 직원, 다른 부서로 이동하며 사정을 반복하는 고객.\u003c/p>\n\u003ch2>만들고 싶은 고객 경험\u003c/h2>\n\u003cp>이미 한 시도와 원하는 해결을 한 번 확인하면 다음 담당자가 이어서 해결한다.\u003c/p>\n\u003ch2>고객 여정\u003c/h2>\n\u003cp>고객이 문의 → AI가 사실·시도·미해결·요청을 구분 → 고객이 수정·공유 선택 → 사람이 처리 → 확인된 해결 사례만 지식 위키에 반영.\u003c/p>\n\u003ch2>지식경영 기여\u003c/h2>\n\u003cp>고객 확인·수정이 가능한 인계 카드, 원문 근거 연결, 정책 버전, 실패한 조치, 해결 여부를 같이 기록한다.\u003c/p>\n\u003ch2>기존 서비스와의 차이 — 검증 전 가설\u003c/h2>\n\u003cp>상담 이관·요약·사람 검토는 Intercom 등에 이미 있다. 차별화 가설은 고객의 인계 정보 통제와 예외 처리 지식의 품질 관리가 추가로 도움이 되는지다.\u003c/p>\n\u003ch2>학생 팀의 최소 구현\u003c/h2>\n\u003cp>가상의 온라인 학회 굿즈숍에서 주문 오류·교환·배송 지연 3유형, 정책 10개, 사례 30개로 데모. 실제 결제 없이 처리 상태만 변경.\u003c/p>\n\u003ch2>검증 실험과 지표\u003c/h2>\n\u003cp>일반 이관 / 자동 요약 / 고객 확인형 구조화 인계 3조건. 같은 문의 난이도로 재설명 횟수·오류·고객 노력·해결 시간을 비교.\u003c/p>\n\u003cp>측정 지표: 반복 설명 수, 핵심 정보 누락률, 정책 오류율, 해결 성공률, 총 처리 시간, 고객 노력.\u003c/p>\n\u003ch2>고객과 사업성 가설\u003c/h2>\n\u003cp>국내 소규모 쇼핑몰 고객지원팀에 월 구독을 받는 B2B 가설. 비용 절감은 상담량×절약 시간×인건비로 추정하되 실측 전 수치를 매출처럼 제시하지 않는다.\u003c/p>\n\u003ch2>취약점·중단 조건\u003c/h2>\n\u003cp>고객 확인 단계가 더 번거로울 수 있고 오류가 인계되면 피해가 확대된다. 확인은 핵심 항목만, 원문 링크·정정 이력·즉시 사람 연결을 제공. 기존 방식보다 핵심 성과가 좋아지지 않거나 추가 운영 부담이 편익을 넘으면 범위를 줄이거나 다른 후보를 선택한다.\u003c/p>\n\u003ch2>논문 근거\u003c/h2>\n\u003cp>\u003ca href=\"#papers/P04.md\">P04\u003c/a> · \u003ca href=\"#papers/P06.md\">P06\u003c/a> · \u003ca href=\"#papers/P07.md\">P07\u003c/a> · \u003ca href=\"#papers/P09.md\">P09\u003c/a> · \u003ca href=\"#papers/P11.md\">P11\u003c/a> · \u003ca href=\"#papers/P12.md\">P12\u003c/a> · \u003ca href=\"#papers/P13.md\">P13\u003c/a> · \u003ca href=\"#papers/P16.md\">P16\u003c/a> · \u003ca href=\"#papers/P19.md\">P19\u003c/a> · \u003ca href=\"#papers/P20.md\">P20\u003c/a> · \u003ca href=\"#papers/P22.md\">P22\u003c/a> · \u003ca href=\"#papers/P23.md\">P23\u003c/a> · \u003ca href=\"#papers/P24.md\">P24\u003c/a>\u003c/p>\n\u003cp>위 논문들은 문제와 설계의 근거다. 이 아이디어의 성과나 독창성을 이미 입증한 것은 아니다.\u003c/p>\n"}, {"id": "ideas/I02.md", "title": "I02 · 알바가 바뀌어도 서비스는 이어진다", "text": "# I02 · 알바가 바뀌어도 서비스는 이어진다\n\n숙련 직원의 예외 처리 노하우를 남기는 매장 위키\n\n[위키 홈](../README.md) · [후보 비교](ideas.md) · [검증 계획](../validation.md)\n\n## 고객과 해결할 문제\n\n점장이나 오래 일한 직원만 품절·쿠폰 오류·불만 고객 대응을 알고 있는 동네 매장.\n\n## 만들고 싶은 고객 경험\n\n신입 직원도 상황에 맞는 처리 이유와 가능한 대안을 바로 찾는다.\n\n## 고객 여정\n\n사건 발생 → 직원이 대응 이유 기록 → 점장 승인 → 다음 직원이 상황 검색 → 결과 피드백으로 사례 수정.\n\n## 지식경영 기여\n\n기존 매뉴얼에 없는 예외·실패·적용 금지 조건을 저장한다. 문서 수보다 재사용 후 해결률을 본다.\n\n## 기존 서비스와의 차이 — 검증 전 가설\n\nKCS의 지식 재사용은 기존 방법이다. 소상공인 업무 흐름에 맞춘 짧은 기록과 신입 학습 전이를 검증하는 것이 과제.\n\n## 학생 팀의 최소 구현\n\n학교 앞 카페 1곳 또는 모의 매장. 메뉴·운영 규정과 점장 인터뷰로 사례 30개. 종이 매뉴얼, 검색 위키, 근거형 AI를 비교.\n\n## 검증 실험과 지표\n\n신입 역할 참가자에게 초기 과제와 AI 없이 푸는 지연 과제를 제공해 단기 속도와 실제 학습을 구분.\n\n측정 지표: 정답률, 승인 요청 횟수, 탐색 시간, AI 제거 후 유지 성과, 점장의 기록 부담.\n\n## 고객과 사업성 가설\n\n프랜차이즈·소규모 다점포 운영사 대상 가설. 점포 단위 구독과 초기 지식 구축 지원.\n\n## 취약점·중단 조건\n\n점장의 잘못된 관행도 복제될 수 있다. 공식 규정과 관행을 분리하고 승인·만료일을 둔다. 기존 방식보다 핵심 성과가 좋아지지 않거나 추가 운영 부담이 편익을 넘으면 범위를 줄이거나 다른 후보를 선택한다.\n\n## 논문 근거\n\n[P01](../papers/P01.md) · [P02](../papers/P02.md) · [P05](../papers/P05.md) · [P07](../papers/P07.md) · [P08](../papers/P08.md) · [P11](../papers/P11.md) · [P12](../papers/P12.md) · [P19](../papers/P19.md) · [P22](../papers/P22.md)\n\n위 논문들은 문제와 설계의 근거다. 이 아이디어의 성과나 독창성을 이미 입증한 것은 아니다.\n", "html": "\u003ch1>I02 · 알바가 바뀌어도 서비스는 이어진다\u003c/h1>\n\u003cp>숙련 직원의 예외 처리 노하우를 남기는 매장 위키\u003c/p>\n\u003cp>\u003ca href=\"#README.md\">위키 홈\u003c/a> · \u003ca href=\"#ideas/ideas.md\">후보 비교\u003c/a> · \u003ca href=\"#validation.md\">검증 계획\u003c/a>\u003c/p>\n\u003ch2>고객과 해결할 문제\u003c/h2>\n\u003cp>점장이나 오래 일한 직원만 품절·쿠폰 오류·불만 고객 대응을 알고 있는 동네 매장.\u003c/p>\n\u003ch2>만들고 싶은 고객 경험\u003c/h2>\n\u003cp>신입 직원도 상황에 맞는 처리 이유와 가능한 대안을 바로 찾는다.\u003c/p>\n\u003ch2>고객 여정\u003c/h2>\n\u003cp>사건 발생 → 직원이 대응 이유 기록 → 점장 승인 → 다음 직원이 상황 검색 → 결과 피드백으로 사례 수정.\u003c/p>\n\u003ch2>지식경영 기여\u003c/h2>\n\u003cp>기존 매뉴얼에 없는 예외·실패·적용 금지 조건을 저장한다. 문서 수보다 재사용 후 해결률을 본다.\u003c/p>\n\u003ch2>기존 서비스와의 차이 — 검증 전 가설\u003c/h2>\n\u003cp>KCS의 지식 재사용은 기존 방법이다. 소상공인 업무 흐름에 맞춘 짧은 기록과 신입 학습 전이를 검증하는 것이 과제.\u003c/p>\n\u003ch2>학생 팀의 최소 구현\u003c/h2>\n\u003cp>학교 앞 카페 1곳 또는 모의 매장. 메뉴·운영 규정과 점장 인터뷰로 사례 30개. 종이 매뉴얼, 검색 위키, 근거형 AI를 비교.\u003c/p>\n\u003ch2>검증 실험과 지표\u003c/h2>\n\u003cp>신입 역할 참가자에게 초기 과제와 AI 없이 푸는 지연 과제를 제공해 단기 속도와 실제 학습을 구분.\u003c/p>\n\u003cp>측정 지표: 정답률, 승인 요청 횟수, 탐색 시간, AI 제거 후 유지 성과, 점장의 기록 부담.\u003c/p>\n\u003ch2>고객과 사업성 가설\u003c/h2>\n\u003cp>프랜차이즈·소규모 다점포 운영사 대상 가설. 점포 단위 구독과 초기 지식 구축 지원.\u003c/p>\n\u003ch2>취약점·중단 조건\u003c/h2>\n\u003cp>점장의 잘못된 관행도 복제될 수 있다. 공식 규정과 관행을 분리하고 승인·만료일을 둔다. 기존 방식보다 핵심 성과가 좋아지지 않거나 추가 운영 부담이 편익을 넘으면 범위를 줄이거나 다른 후보를 선택한다.\u003c/p>\n\u003ch2>논문 근거\u003c/h2>\n\u003cp>\u003ca href=\"#papers/P01.md\">P01\u003c/a> · \u003ca href=\"#papers/P02.md\">P02\u003c/a> · \u003ca href=\"#papers/P05.md\">P05\u003c/a> · \u003ca href=\"#papers/P07.md\">P07\u003c/a> · \u003ca href=\"#papers/P08.md\">P08\u003c/a> · \u003ca href=\"#papers/P11.md\">P11\u003c/a> · \u003ca href=\"#papers/P12.md\">P12\u003c/a> · \u003ca href=\"#papers/P19.md\">P19\u003c/a> · \u003ca href=\"#papers/P22.md\">P22\u003c/a>\u003c/p>\n\u003cp>위 논문들은 문제와 설계의 근거다. 이 아이디어의 성과나 독창성을 이미 입증한 것은 아니다.\u003c/p>\n"}, {"id": "ideas/I03.md", "title": "I03 · 시니어가 끝까지 직접 처리하는 주문", "text": "# I03 · 시니어가 끝까지 직접 처리하는 주문\n\n단계별 안내와 도움 연결을 결합한 디지털 이용 지원\n\n[위키 홈](../README.md) · [후보 비교](ideas.md) · [검증 계획](../validation.md)\n\n## 고객과 해결할 문제\n\n주문·예약 화면에서 막힌 뒤 포기하거나 주변 사람에게 기기를 넘기는 이용자.\n\n## 만들고 싶은 고객 경험\n\n큰 글씨, 다음 한 단계 설명, 되돌리기와 사람 도움으로 스스로 완료한다.\n\n## 고객 여정\n\n목표 선택 → 한 단계 실행 → 실행 결과 확인 → 막히면 도움 요청 → 막힌 단계와 해결 설명을 익명 사례로 축적.\n\n## 지식경영 기여\n\n쉽게 만든 화면에 더해 도움을 요청한 이유와 효과적인 설명을 지식화한다. 연령만으로 어려움을 추정하지 않는다.\n\n## 기존 서비스와의 차이 — 검증 전 가설\n\n접근성 화면은 이미 보편적인 설계 방향이다. 독립 완료율과 다음 사용의 학습 유지로 추가 가치를 확인.\n\n## 학생 팀의 최소 구현\n\n결제 없는 카페 주문 모형. 실제 대상자와 공동 설계하며 음성·문자·직원 호출을 제공.\n\n## 검증 실험과 지표\n\n기본 화면 / 접근성 화면 / 접근성+단계 안내 조건. 디지털 숙련도를 기록하고 순서 효과를 통제.\n\n측정 지표: 독립 완료율, 오류 회복률, 도움 횟수, 부담감, 일주일 뒤 재수행 성공률.\n\n## 고객과 사업성 가설\n\n매장·복지관·공공시설 운영자 대상 도입 가설. 하드웨어 교체보다 기존 안내 보완부터 검토.\n\n## 취약점·중단 조건\n\n시니어 모집과 현장 접근이 필요하다. 대학생 대리 실험만으로 시니어 효과를 주장하지 않는다. 기존 방식보다 핵심 성과가 좋아지지 않거나 추가 운영 부담이 편익을 넘으면 범위를 줄이거나 다른 후보를 선택한다.\n\n## 논문 근거\n\n[P04](../papers/P04.md) · [P05](../papers/P05.md) · [P15](../papers/P15.md) · [P17](../papers/P17.md) · [P21](../papers/P21.md) · [P24](../papers/P24.md)\n\n위 논문들은 문제와 설계의 근거다. 이 아이디어의 성과나 독창성을 이미 입증한 것은 아니다.\n", "html": "\u003ch1>I03 · 시니어가 끝까지 직접 처리하는 주문\u003c/h1>\n\u003cp>단계별 안내와 도움 연결을 결합한 디지털 이용 지원\u003c/p>\n\u003cp>\u003ca href=\"#README.md\">위키 홈\u003c/a> · \u003ca href=\"#ideas/ideas.md\">후보 비교\u003c/a> · \u003ca href=\"#validation.md\">검증 계획\u003c/a>\u003c/p>\n\u003ch2>고객과 해결할 문제\u003c/h2>\n\u003cp>주문·예약 화면에서 막힌 뒤 포기하거나 주변 사람에게 기기를 넘기는 이용자.\u003c/p>\n\u003ch2>만들고 싶은 고객 경험\u003c/h2>\n\u003cp>큰 글씨, 다음 한 단계 설명, 되돌리기와 사람 도움으로 스스로 완료한다.\u003c/p>\n\u003ch2>고객 여정\u003c/h2>\n\u003cp>목표 선택 → 한 단계 실행 → 실행 결과 확인 → 막히면 도움 요청 → 막힌 단계와 해결 설명을 익명 사례로 축적.\u003c/p>\n\u003ch2>지식경영 기여\u003c/h2>\n\u003cp>쉽게 만든 화면에 더해 도움을 요청한 이유와 효과적인 설명을 지식화한다. 연령만으로 어려움을 추정하지 않는다.\u003c/p>\n\u003ch2>기존 서비스와의 차이 — 검증 전 가설\u003c/h2>\n\u003cp>접근성 화면은 이미 보편적인 설계 방향이다. 독립 완료율과 다음 사용의 학습 유지로 추가 가치를 확인.\u003c/p>\n\u003ch2>학생 팀의 최소 구현\u003c/h2>\n\u003cp>결제 없는 카페 주문 모형. 실제 대상자와 공동 설계하며 음성·문자·직원 호출을 제공.\u003c/p>\n\u003ch2>검증 실험과 지표\u003c/h2>\n\u003cp>기본 화면 / 접근성 화면 / 접근성+단계 안내 조건. 디지털 숙련도를 기록하고 순서 효과를 통제.\u003c/p>\n\u003cp>측정 지표: 독립 완료율, 오류 회복률, 도움 횟수, 부담감, 일주일 뒤 재수행 성공률.\u003c/p>\n\u003ch2>고객과 사업성 가설\u003c/h2>\n\u003cp>매장·복지관·공공시설 운영자 대상 도입 가설. 하드웨어 교체보다 기존 안내 보완부터 검토.\u003c/p>\n\u003ch2>취약점·중단 조건\u003c/h2>\n\u003cp>시니어 모집과 현장 접근이 필요하다. 대학생 대리 실험만으로 시니어 효과를 주장하지 않는다. 기존 방식보다 핵심 성과가 좋아지지 않거나 추가 운영 부담이 편익을 넘으면 범위를 줄이거나 다른 후보를 선택한다.\u003c/p>\n\u003ch2>논문 근거\u003c/h2>\n\u003cp>\u003ca href=\"#papers/P04.md\">P04\u003c/a> · \u003ca href=\"#papers/P05.md\">P05\u003c/a> · \u003ca href=\"#papers/P15.md\">P15\u003c/a> · \u003ca href=\"#papers/P17.md\">P17\u003c/a> · \u003ca href=\"#papers/P21.md\">P21\u003c/a> · \u003ca href=\"#papers/P24.md\">P24\u003c/a>\u003c/p>\n\u003cp>위 논문들은 문제와 설계의 근거다. 이 아이디어의 성과나 독창성을 이미 입증한 것은 아니다.\u003c/p>\n"}, {"id": "ideas/I04.md", "title": "I04 · 리뷰가 실제 개선으로 이어지는 매장", "text": "# I04 · 리뷰가 실제 개선으로 이어지는 매장\n\n고객 불만을 개선 작업과 결과로 연결하는 위키\n\n[위키 홈](../README.md) · [후보 비교](ideas.md) · [검증 계획](../validation.md)\n\n## 고객과 해결할 문제\n\n리뷰에 매번 사과하지만 같은 문제가 반복되는 매장과 고객.\n\n## 만들고 싶은 고객 경험\n\n불만 제기 후 무엇이 바뀌었는지 확인하고 다음 방문에서 개선을 경험한다.\n\n## 고객 여정\n\n리뷰·직접 제보 → 문제 유형 분류 → 담당자·개선안 지정 → 실행 증거 → 재발 여부 → 검증된 사례 축적.\n\n## 지식경영 기여\n\n토픽 분석에서 끝내지 않고 문제-조치-결과를 연결한다. 반박 사례와 실패한 개선도 보존.\n\n## 기존 서비스와의 차이 — 검증 전 가설\n\n리뷰 분석·답글 생성은 흔하다. 개선 작업 완료와 재발 감소를 추적하는 운영 연결이 핵심 가설.\n\n## 학생 팀의 최소 구현\n\n협력 매장의 허락 받은 후기 또는 직접 인터뷰 100건 내외를 수작업 코딩과 비교.\n\n## 검증 실험과 지표\n\n분류 정확도는 사람 코딩 기준으로 평가. 현장 성과는 기간·방문량·계절 영향을 통제해 관찰하고 인과 주장은 제한.\n\n측정 지표: 동일 문제 재발률, 개선 완료율, 사람 검토 시간, 잘못된 문제 병합률.\n\n## 고객과 사업성 가설\n\n매장 운영자 B2B. 다점포 본사가 반복 문제를 찾는 경우 확장 가능.\n\n## 취약점·중단 조건\n\n불만 리뷰만으로 전체 고객을 대표할 수 없다. 만족 고객·이탈 고객 인터뷰도 포함. 기존 방식보다 핵심 성과가 좋아지지 않거나 추가 운영 부담이 편익을 넘으면 범위를 줄이거나 다른 후보를 선택한다.\n\n## 논문 근거\n\n[P01](../papers/P01.md) · [P02](../papers/P02.md) · [P03](../papers/P03.md) · [P06](../papers/P06.md) · [P08](../papers/P08.md) · [P09](../papers/P09.md) · [P16](../papers/P16.md) · [P18](../papers/P18.md)\n\n위 논문들은 문제와 설계의 근거다. 이 아이디어의 성과나 독창성을 이미 입증한 것은 아니다.\n", "html": "\u003ch1>I04 · 리뷰가 실제 개선으로 이어지는 매장\u003c/h1>\n\u003cp>고객 불만을 개선 작업과 결과로 연결하는 위키\u003c/p>\n\u003cp>\u003ca href=\"#README.md\">위키 홈\u003c/a> · \u003ca href=\"#ideas/ideas.md\">후보 비교\u003c/a> · \u003ca href=\"#validation.md\">검증 계획\u003c/a>\u003c/p>\n\u003ch2>고객과 해결할 문제\u003c/h2>\n\u003cp>리뷰에 매번 사과하지만 같은 문제가 반복되는 매장과 고객.\u003c/p>\n\u003ch2>만들고 싶은 고객 경험\u003c/h2>\n\u003cp>불만 제기 후 무엇이 바뀌었는지 확인하고 다음 방문에서 개선을 경험한다.\u003c/p>\n\u003ch2>고객 여정\u003c/h2>\n\u003cp>리뷰·직접 제보 → 문제 유형 분류 → 담당자·개선안 지정 → 실행 증거 → 재발 여부 → 검증된 사례 축적.\u003c/p>\n\u003ch2>지식경영 기여\u003c/h2>\n\u003cp>토픽 분석에서 끝내지 않고 문제-조치-결과를 연결한다. 반박 사례와 실패한 개선도 보존.\u003c/p>\n\u003ch2>기존 서비스와의 차이 — 검증 전 가설\u003c/h2>\n\u003cp>리뷰 분석·답글 생성은 흔하다. 개선 작업 완료와 재발 감소를 추적하는 운영 연결이 핵심 가설.\u003c/p>\n\u003ch2>학생 팀의 최소 구현\u003c/h2>\n\u003cp>협력 매장의 허락 받은 후기 또는 직접 인터뷰 100건 내외를 수작업 코딩과 비교.\u003c/p>\n\u003ch2>검증 실험과 지표\u003c/h2>\n\u003cp>분류 정확도는 사람 코딩 기준으로 평가. 현장 성과는 기간·방문량·계절 영향을 통제해 관찰하고 인과 주장은 제한.\u003c/p>\n\u003cp>측정 지표: 동일 문제 재발률, 개선 완료율, 사람 검토 시간, 잘못된 문제 병합률.\u003c/p>\n\u003ch2>고객과 사업성 가설\u003c/h2>\n\u003cp>매장 운영자 B2B. 다점포 본사가 반복 문제를 찾는 경우 확장 가능.\u003c/p>\n\u003ch2>취약점·중단 조건\u003c/h2>\n\u003cp>불만 리뷰만으로 전체 고객을 대표할 수 없다. 만족 고객·이탈 고객 인터뷰도 포함. 기존 방식보다 핵심 성과가 좋아지지 않거나 추가 운영 부담이 편익을 넘으면 범위를 줄이거나 다른 후보를 선택한다.\u003c/p>\n\u003ch2>논문 근거\u003c/h2>\n\u003cp>\u003ca href=\"#papers/P01.md\">P01\u003c/a> · \u003ca href=\"#papers/P02.md\">P02\u003c/a> · \u003ca href=\"#papers/P03.md\">P03\u003c/a> · \u003ca href=\"#papers/P06.md\">P06\u003c/a> · \u003ca href=\"#papers/P08.md\">P08\u003c/a> · \u003ca href=\"#papers/P09.md\">P09\u003c/a> · \u003ca href=\"#papers/P16.md\">P16\u003c/a> · \u003ca href=\"#papers/P18.md\">P18\u003c/a>\u003c/p>\n\u003cp>위 논문들은 문제와 설계의 근거다. 이 아이디어의 성과나 독창성을 이미 입증한 것은 아니다.\u003c/p>\n"}, {"id": "ideas/I05.md", "title": "I05 · 창구를 돌지 않는 서류·예약 안내", "text": "# I05 · 창구를 돌지 않는 서류·예약 안내\n\n학교 행정부터 검증하는 규정 출처형 안내\n\n[위키 홈](../README.md) · [후보 비교](ideas.md) · [검증 계획](../validation.md)\n\n## 고객과 해결할 문제\n\n필요 서류를 빠뜨리거나 부서마다 다른 안내를 받는 학생·방문자.\n\n## 만들고 싶은 고객 경험\n\n방문 전에 준비물을 확인하고 담당 부서에 상황이 전달된다.\n\n## 고객 여정\n\n상황 입력 → 유효한 공지 검색 → 준비물 확인 → 담당자 연결 → 안내 오류를 정정 지식으로 축적.\n\n## 지식경영 기여\n\n유효기간과 담당 부서를 가진 지식 카드, 불확실한 경우의 명확한 연결.\n\n## 기존 서비스와의 차이 — 검증 전 가설\n\nFAQ와 RAG만으로는 약하다. 규정 충돌·오래된 공지·부서 이관의 해결 능력이 검증 대상.\n\n## 학생 팀의 최소 구현\n\n자신의 학교 장학·증명서 등 공개 안내 중 1영역. 실제 민원·개인정보 없이 시나리오로 검증.\n\n## 검증 실험과 지표\n\n일반 검색과 비교해 준비물 정답률·잘못된 부서 추천·재방문 예상 횟수를 측정.\n\n측정 지표: 출처 정확성, 오래된 규정 사용률, 준비 완료율, 담당 부서 연결 정확도.\n\n## 고객과 사업성 가설\n\n대학·시설 운영자 대상 가설. 병원 확장은 행정 안내로 한정하고 별도 현장 검증.\n\n## 취약점·중단 조건\n\n규정의 갱신 책임자가 없으면 정확성을 유지하기 어렵다. 병원 진료 판단까지 범위를 넓히지 않는다. 기존 방식보다 핵심 성과가 좋아지지 않거나 추가 운영 부담이 편익을 넘으면 범위를 줄이거나 다른 후보를 선택한다.\n\n## 논문 근거\n\n[P04](../papers/P04.md) · [P05](../papers/P05.md) · [P06](../papers/P06.md) · [P12](../papers/P12.md) · [P23](../papers/P23.md) · [P25](../papers/P25.md)\n\n위 논문들은 문제와 설계의 근거다. 이 아이디어의 성과나 독창성을 이미 입증한 것은 아니다.\n", "html": "\u003ch1>I05 · 창구를 돌지 않는 서류·예약 안내\u003c/h1>\n\u003cp>학교 행정부터 검증하는 규정 출처형 안내\u003c/p>\n\u003cp>\u003ca href=\"#README.md\">위키 홈\u003c/a> · \u003ca href=\"#ideas/ideas.md\">후보 비교\u003c/a> · \u003ca href=\"#validation.md\">검증 계획\u003c/a>\u003c/p>\n\u003ch2>고객과 해결할 문제\u003c/h2>\n\u003cp>필요 서류를 빠뜨리거나 부서마다 다른 안내를 받는 학생·방문자.\u003c/p>\n\u003ch2>만들고 싶은 고객 경험\u003c/h2>\n\u003cp>방문 전에 준비물을 확인하고 담당 부서에 상황이 전달된다.\u003c/p>\n\u003ch2>고객 여정\u003c/h2>\n\u003cp>상황 입력 → 유효한 공지 검색 → 준비물 확인 → 담당자 연결 → 안내 오류를 정정 지식으로 축적.\u003c/p>\n\u003ch2>지식경영 기여\u003c/h2>\n\u003cp>유효기간과 담당 부서를 가진 지식 카드, 불확실한 경우의 명확한 연결.\u003c/p>\n\u003ch2>기존 서비스와의 차이 — 검증 전 가설\u003c/h2>\n\u003cp>FAQ와 RAG만으로는 약하다. 규정 충돌·오래된 공지·부서 이관의 해결 능력이 검증 대상.\u003c/p>\n\u003ch2>학생 팀의 최소 구현\u003c/h2>\n\u003cp>자신의 학교 장학·증명서 등 공개 안내 중 1영역. 실제 민원·개인정보 없이 시나리오로 검증.\u003c/p>\n\u003ch2>검증 실험과 지표\u003c/h2>\n\u003cp>일반 검색과 비교해 준비물 정답률·잘못된 부서 추천·재방문 예상 횟수를 측정.\u003c/p>\n\u003cp>측정 지표: 출처 정확성, 오래된 규정 사용률, 준비 완료율, 담당 부서 연결 정확도.\u003c/p>\n\u003ch2>고객과 사업성 가설\u003c/h2>\n\u003cp>대학·시설 운영자 대상 가설. 병원 확장은 행정 안내로 한정하고 별도 현장 검증.\u003c/p>\n\u003ch2>취약점·중단 조건\u003c/h2>\n\u003cp>규정의 갱신 책임자가 없으면 정확성을 유지하기 어렵다. 병원 진료 판단까지 범위를 넓히지 않는다. 기존 방식보다 핵심 성과가 좋아지지 않거나 추가 운영 부담이 편익을 넘으면 범위를 줄이거나 다른 후보를 선택한다.\u003c/p>\n\u003ch2>논문 근거\u003c/h2>\n\u003cp>\u003ca href=\"#papers/P04.md\">P04\u003c/a> · \u003ca href=\"#papers/P05.md\">P05\u003c/a> · \u003ca href=\"#papers/P06.md\">P06\u003c/a> · \u003ca href=\"#papers/P12.md\">P12\u003c/a> · \u003ca href=\"#papers/P23.md\">P23\u003c/a> · \u003ca href=\"#papers/P25.md\">P25\u003c/a>\u003c/p>\n\u003cp>위 논문들은 문제와 설계의 근거다. 이 아이디어의 성과나 독창성을 이미 입증한 것은 아니다.\u003c/p>\n"}, {"id": "ideas/I06.md", "title": "I06 · 조건을 지키는 여행 추천", "text": "# I06 · 조건을 지키는 여행 추천\n\n좋아 보이는 추천보다 실제 이용 가능한 선택지\n\n[위키 홈](../README.md) · [후보 비교](ideas.md) · [검증 계획](../validation.md)\n\n## 고객과 해결할 문제\n\n유모차·이동 제약·시간 제약 때문에 추천받은 장소를 실제 이용하지 못하는 여행자.\n\n## 만들고 싶은 고객 경험\n\n필수 조건과 정보의 확인 시점을 보고 선택하며 틀린 정보를 수정한다.\n\n## 고객 여정\n\n필수 조건 입력 → 검증된 시설 정보 필터 → 후보와 제외 이유 → 이용 후 오류 제보 → 검토 후 지식 수정.\n\n## 지식경영 기여\n\n사실 조건과 취향을 구분하고 이용 불가 사유·정보 신선도를 관리.\n\n## 기존 서비스와의 차이 — 검증 전 가설\n\n일반 여행 챗봇과 차별성이 약하다. 한 지역·한 고객 집단의 검증된 접근 조건에 집중.\n\n## 학생 팀의 최소 구현\n\n학교 주변 시설 20곳을 직접 확인해 데이터 구축. 실시간 예약 없이 조건 충족 후보만 제안.\n\n## 검증 실험과 지표\n\n일반 추천과 조건 기반 추천을 비교해 필수 제약 위반률과 검증 시간을 측정.\n\n측정 지표: 제약 위반률, 정보 갱신 비용, 실제 방문 가능률, 선택 만족.\n\n## 고객과 사업성 가설\n\n관광지 운영자나 여행업체 대상 가설이나 지불 의사는 미확인.\n\n## 취약점·중단 조건\n\n실시간 접근성 정보 확보가 어려우며 잘못된 접근 안내의 영향이 크다. 확인 날짜와 미확인 표시 필수. 기존 방식보다 핵심 성과가 좋아지지 않거나 추가 운영 부담이 편익을 넘으면 범위를 줄이거나 다른 후보를 선택한다.\n\n## 논문 근거\n\n[P04](../papers/P04.md) · [P10](../papers/P10.md) · [P18](../papers/P18.md) · [P23](../papers/P23.md)\n\n위 논문들은 문제와 설계의 근거다. 이 아이디어의 성과나 독창성을 이미 입증한 것은 아니다.\n", "html": "\u003ch1>I06 · 조건을 지키는 여행 추천\u003c/h1>\n\u003cp>좋아 보이는 추천보다 실제 이용 가능한 선택지\u003c/p>\n\u003cp>\u003ca href=\"#README.md\">위키 홈\u003c/a> · \u003ca href=\"#ideas/ideas.md\">후보 비교\u003c/a> · \u003ca href=\"#validation.md\">검증 계획\u003c/a>\u003c/p>\n\u003ch2>고객과 해결할 문제\u003c/h2>\n\u003cp>유모차·이동 제약·시간 제약 때문에 추천받은 장소를 실제 이용하지 못하는 여행자.\u003c/p>\n\u003ch2>만들고 싶은 고객 경험\u003c/h2>\n\u003cp>필수 조건과 정보의 확인 시점을 보고 선택하며 틀린 정보를 수정한다.\u003c/p>\n\u003ch2>고객 여정\u003c/h2>\n\u003cp>필수 조건 입력 → 검증된 시설 정보 필터 → 후보와 제외 이유 → 이용 후 오류 제보 → 검토 후 지식 수정.\u003c/p>\n\u003ch2>지식경영 기여\u003c/h2>\n\u003cp>사실 조건과 취향을 구분하고 이용 불가 사유·정보 신선도를 관리.\u003c/p>\n\u003ch2>기존 서비스와의 차이 — 검증 전 가설\u003c/h2>\n\u003cp>일반 여행 챗봇과 차별성이 약하다. 한 지역·한 고객 집단의 검증된 접근 조건에 집중.\u003c/p>\n\u003ch2>학생 팀의 최소 구현\u003c/h2>\n\u003cp>학교 주변 시설 20곳을 직접 확인해 데이터 구축. 실시간 예약 없이 조건 충족 후보만 제안.\u003c/p>\n\u003ch2>검증 실험과 지표\u003c/h2>\n\u003cp>일반 추천과 조건 기반 추천을 비교해 필수 제약 위반률과 검증 시간을 측정.\u003c/p>\n\u003cp>측정 지표: 제약 위반률, 정보 갱신 비용, 실제 방문 가능률, 선택 만족.\u003c/p>\n\u003ch2>고객과 사업성 가설\u003c/h2>\n\u003cp>관광지 운영자나 여행업체 대상 가설이나 지불 의사는 미확인.\u003c/p>\n\u003ch2>취약점·중단 조건\u003c/h2>\n\u003cp>실시간 접근성 정보 확보가 어려우며 잘못된 접근 안내의 영향이 크다. 확인 날짜와 미확인 표시 필수. 기존 방식보다 핵심 성과가 좋아지지 않거나 추가 운영 부담이 편익을 넘으면 범위를 줄이거나 다른 후보를 선택한다.\u003c/p>\n\u003ch2>논문 근거\u003c/h2>\n\u003cp>\u003ca href=\"#papers/P04.md\">P04\u003c/a> · \u003ca href=\"#papers/P10.md\">P10\u003c/a> · \u003ca href=\"#papers/P18.md\">P18\u003c/a> · \u003ca href=\"#papers/P23.md\">P23\u003c/a>\u003c/p>\n\u003cp>위 논문들은 문제와 설계의 근거다. 이 아이디어의 성과나 독창성을 이미 입증한 것은 아니다.\u003c/p>\n"}, {"id": "ideas/I07.md", "title": "I07 · 내가 정하는 개인화 기억", "text": "# I07 · 내가 정하는 개인화 기억\n\n고객이 기억 범위와 삭제를 정하는 서비스 카드\n\n[위키 홈](../README.md) · [후보 비교](ideas.md) · [검증 계획](../validation.md)\n\n## 고객과 해결할 문제\n\n개인화는 원하지만 회사가 무엇을 기억하는지 모르는 고객.\n\n## 만들고 싶은 고객 경험\n\n이번 문의만 쓸 정보와 다음에도 기억할 선호를 직접 정한다.\n\n## 고객 여정\n\n정보 제안 → 목적별 공유 선택 → 개인화 적용 → 기억 목록 확인·수정 → 삭제 상태 확인.\n\n## 지식경영 기여\n\n민감한 원문을 모으는 대신 필요한 선호만 분리하고 사용 근거를 보여준다.\n\n## 기존 서비스와의 차이 — 검증 전 가설\n\n개인화·동의 관리와 유사하다. 통제감 상승이 실제 사용 부담을 상쇄하는지 검증해야 한다.\n\n## 학생 팀의 최소 구현\n\n가상의 쇼핑 추천에서 사이즈·예산·색상 선호만 사용하고 실명 데이터는 받지 않는다.\n\n## 검증 실험과 지표\n\n일괄 기억 / 항목별 선택 / 문의 후 만료 조건을 비교해 통제감·입력 부담·추천 유용성을 측정.\n\n측정 지표: 선택 이해도, 정보 제공 의향, 삭제 성공, 추천 유용성, 설정 시간.\n\n## 고객과 사업성 가설\n\n고객지원·커머스 솔루션의 기능으로 제안. 독립 서비스의 구매자는 불명확.\n\n## 취약점·중단 조건\n\n복잡한 설정으로 피로가 늘 수 있다. 삭제가 검색 인덱스와 파생 기록에도 반영되는지 확인. 기존 방식보다 핵심 성과가 좋아지지 않거나 추가 운영 부담이 편익을 넘으면 범위를 줄이거나 다른 후보를 선택한다.\n\n## 논문 근거\n\n[P03](../papers/P03.md) · [P10](../papers/P10.md) · [P20](../papers/P20.md) · [P21](../papers/P21.md) · [P22](../papers/P22.md) · [P24](../papers/P24.md)\n\n위 논문들은 문제와 설계의 근거다. 이 아이디어의 성과나 독창성을 이미 입증한 것은 아니다.\n", "html": "\u003ch1>I07 · 내가 정하는 개인화 기억\u003c/h1>\n\u003cp>고객이 기억 범위와 삭제를 정하는 서비스 카드\u003c/p>\n\u003cp>\u003ca href=\"#README.md\">위키 홈\u003c/a> · \u003ca href=\"#ideas/ideas.md\">후보 비교\u003c/a> · \u003ca href=\"#validation.md\">검증 계획\u003c/a>\u003c/p>\n\u003ch2>고객과 해결할 문제\u003c/h2>\n\u003cp>개인화는 원하지만 회사가 무엇을 기억하는지 모르는 고객.\u003c/p>\n\u003ch2>만들고 싶은 고객 경험\u003c/h2>\n\u003cp>이번 문의만 쓸 정보와 다음에도 기억할 선호를 직접 정한다.\u003c/p>\n\u003ch2>고객 여정\u003c/h2>\n\u003cp>정보 제안 → 목적별 공유 선택 → 개인화 적용 → 기억 목록 확인·수정 → 삭제 상태 확인.\u003c/p>\n\u003ch2>지식경영 기여\u003c/h2>\n\u003cp>민감한 원문을 모으는 대신 필요한 선호만 분리하고 사용 근거를 보여준다.\u003c/p>\n\u003ch2>기존 서비스와의 차이 — 검증 전 가설\u003c/h2>\n\u003cp>개인화·동의 관리와 유사하다. 통제감 상승이 실제 사용 부담을 상쇄하는지 검증해야 한다.\u003c/p>\n\u003ch2>학생 팀의 최소 구현\u003c/h2>\n\u003cp>가상의 쇼핑 추천에서 사이즈·예산·색상 선호만 사용하고 실명 데이터는 받지 않는다.\u003c/p>\n\u003ch2>검증 실험과 지표\u003c/h2>\n\u003cp>일괄 기억 / 항목별 선택 / 문의 후 만료 조건을 비교해 통제감·입력 부담·추천 유용성을 측정.\u003c/p>\n\u003cp>측정 지표: 선택 이해도, 정보 제공 의향, 삭제 성공, 추천 유용성, 설정 시간.\u003c/p>\n\u003ch2>고객과 사업성 가설\u003c/h2>\n\u003cp>고객지원·커머스 솔루션의 기능으로 제안. 독립 서비스의 구매자는 불명확.\u003c/p>\n\u003ch2>취약점·중단 조건\u003c/h2>\n\u003cp>복잡한 설정으로 피로가 늘 수 있다. 삭제가 검색 인덱스와 파생 기록에도 반영되는지 확인. 기존 방식보다 핵심 성과가 좋아지지 않거나 추가 운영 부담이 편익을 넘으면 범위를 줄이거나 다른 후보를 선택한다.\u003c/p>\n\u003ch2>논문 근거\u003c/h2>\n\u003cp>\u003ca href=\"#papers/P03.md\">P03\u003c/a> · \u003ca href=\"#papers/P10.md\">P10\u003c/a> · \u003ca href=\"#papers/P20.md\">P20\u003c/a> · \u003ca href=\"#papers/P21.md\">P21\u003c/a> · \u003ca href=\"#papers/P22.md\">P22\u003c/a> · \u003ca href=\"#papers/P24.md\">P24\u003c/a>\u003c/p>\n\u003cp>위 논문들은 문제와 설계의 근거다. 이 아이디어의 성과나 독창성을 이미 입증한 것은 아니다.\u003c/p>\n"}, {"id": "ideas/I08.md", "title": "I08 · 고객지원 AI의 실패를 먼저 찾는 실험실", "text": "# I08 · 고객지원 AI의 실패를 먼저 찾는 실험실\n\n한국어 예외 상황과 사용자 행동을 포함한 평가 위키\n\n[위키 홈](../README.md) · [후보 비교](ideas.md) · [검증 계획](../validation.md)\n\n## 고객과 해결할 문제\n\n평범한 질문에는 답하지만 복잡한 변경·이관에서 실패하는 고객지원 AI를 운영하는 팀.\n\n## 만들고 싶은 고객 경험\n\n출시 전에 실패 상황을 발견해 실제 고객의 잘못된 안내를 줄인다.\n\n## 고객 여정\n\n규정·시나리오 입력 → 반복 대화 → 상태·근거·권한 평가 → 실패 분류 → 회귀 시험에 추가.\n\n## 지식경영 기여\n\n동일 질문 반복 성공, 규정 버전, 고객의 실제 단계 실행과 인계 오류를 함께 기록.\n\n## 기존 서비스와의 차이 — 검증 전 가설\n\nτ-bench 계열과 중복된다. 한국어·국내 특정 서비스 정책·직접 수집한 예외를 검증해야 차별화 가능.\n\n## 학생 팀의 최소 구현\n\n가상 매장 정책과 40개 시나리오. 10개는 개발 중 보지 않는 평가 세트로 보관.\n\n## 검증 실험과 지표\n\n정확도뿐 아니라 정책 위반·누락·반복 성공률과 수정 뒤 회귀를 측정.\n\n측정 지표: 상태 정답률, 정책 위반률, 반복 성공률, 평가자 간 일치도.\n\n## 고객과 사업성 가설\n\n고객지원 솔루션 운영사 대상 B2B 가설. 기술 구현 역량이 큰 경우 적합.\n\n## 취약점·중단 조건\n\n시뮬레이션 고객만으로 실제 CX 개선을 주장할 수 없다. 사람 평가 표본을 별도로 둔다. 기존 방식보다 핵심 성과가 좋아지지 않거나 추가 운영 부담이 편익을 넘으면 범위를 줄이거나 다른 후보를 선택한다.\n\n## 논문 근거\n\n[P11](../papers/P11.md) · [P12](../papers/P12.md) · [P13](../papers/P13.md) · [P14](../papers/P14.md) · [P15](../papers/P15.md) · [P19](../papers/P19.md)\n\n위 논문들은 문제와 설계의 근거다. 이 아이디어의 성과나 독창성을 이미 입증한 것은 아니다.\n", "html": "\u003ch1>I08 · 고객지원 AI의 실패를 먼저 찾는 실험실\u003c/h1>\n\u003cp>한국어 예외 상황과 사용자 행동을 포함한 평가 위키\u003c/p>\n\u003cp>\u003ca href=\"#README.md\">위키 홈\u003c/a> · \u003ca href=\"#ideas/ideas.md\">후보 비교\u003c/a> · \u003ca href=\"#validation.md\">검증 계획\u003c/a>\u003c/p>\n\u003ch2>고객과 해결할 문제\u003c/h2>\n\u003cp>평범한 질문에는 답하지만 복잡한 변경·이관에서 실패하는 고객지원 AI를 운영하는 팀.\u003c/p>\n\u003ch2>만들고 싶은 고객 경험\u003c/h2>\n\u003cp>출시 전에 실패 상황을 발견해 실제 고객의 잘못된 안내를 줄인다.\u003c/p>\n\u003ch2>고객 여정\u003c/h2>\n\u003cp>규정·시나리오 입력 → 반복 대화 → 상태·근거·권한 평가 → 실패 분류 → 회귀 시험에 추가.\u003c/p>\n\u003ch2>지식경영 기여\u003c/h2>\n\u003cp>동일 질문 반복 성공, 규정 버전, 고객의 실제 단계 실행과 인계 오류를 함께 기록.\u003c/p>\n\u003ch2>기존 서비스와의 차이 — 검증 전 가설\u003c/h2>\n\u003cp>τ-bench 계열과 중복된다. 한국어·국내 특정 서비스 정책·직접 수집한 예외를 검증해야 차별화 가능.\u003c/p>\n\u003ch2>학생 팀의 최소 구현\u003c/h2>\n\u003cp>가상 매장 정책과 40개 시나리오. 10개는 개발 중 보지 않는 평가 세트로 보관.\u003c/p>\n\u003ch2>검증 실험과 지표\u003c/h2>\n\u003cp>정확도뿐 아니라 정책 위반·누락·반복 성공률과 수정 뒤 회귀를 측정.\u003c/p>\n\u003cp>측정 지표: 상태 정답률, 정책 위반률, 반복 성공률, 평가자 간 일치도.\u003c/p>\n\u003ch2>고객과 사업성 가설\u003c/h2>\n\u003cp>고객지원 솔루션 운영사 대상 B2B 가설. 기술 구현 역량이 큰 경우 적합.\u003c/p>\n\u003ch2>취약점·중단 조건\u003c/h2>\n\u003cp>시뮬레이션 고객만으로 실제 CX 개선을 주장할 수 없다. 사람 평가 표본을 별도로 둔다. 기존 방식보다 핵심 성과가 좋아지지 않거나 추가 운영 부담이 편익을 넘으면 범위를 줄이거나 다른 후보를 선택한다.\u003c/p>\n\u003ch2>논문 근거\u003c/h2>\n\u003cp>\u003ca href=\"#papers/P11.md\">P11\u003c/a> · \u003ca href=\"#papers/P12.md\">P12\u003c/a> · \u003ca href=\"#papers/P13.md\">P13\u003c/a> · \u003ca href=\"#papers/P14.md\">P14\u003c/a> · \u003ca href=\"#papers/P15.md\">P15\u003c/a> · \u003ca href=\"#papers/P19.md\">P19\u003c/a>\u003c/p>\n\u003cp>위 논문들은 문제와 설계의 근거다. 이 아이디어의 성과나 독창성을 이미 입증한 것은 아니다.\u003c/p>\n"}, {"id": "ideas/ideas.md", "title": "후보 비교와 선택 기준", "text": "# 후보 비교와 선택 기준\n\n[위키 홈](../README.md) · [논문 지도](../literature.md)\n\n대회 공식 심사표를 확보하지 못했으므로 아래는 조사자의 상대적 판단이다. 시장 검증 결과나 수상 확률이 아니다. 학생 팀이 3~4주 동안 시제품과 소규모 사용자 검증을 수행한다는 가정이다.\n\n| 후보 | 고객 가치 | 학회 연결 | 학생 실행성 | 가장 큰 제약 | 판단 |\n|---|---|---|---|---|---|\n| [I01 상담 인계](I01.md) | 반복 설명·미해결 감소 | 고객 지식·조직 기억 | 높음: 모의 상담 가능 | 상용 이관 기능과 차별화 | 종합 추천 |\n| [I02 매장 노하우](I02.md) | 직원별 서비스 편차 감소 | 암묵지 전환·공유 | 높음: 협력 매장 필요 | 점장의 기록 참여 | 현장 협력 가능 시 1순위 |\n| [I03 시니어 지원](I03.md) | 스스로 이용 완료 | 설명 지식·디지털 신뢰 | 중간 | 실제 대상자 모집 | 사회적 가치 중심 추천 |\n| [I04 리뷰→개선](I04.md) | 같은 불편 재발 감소 | 고객 지식→조직 학습 | 높음 | 장기 개선 효과 관찰 | 데이터 분석 중심 대안 |\n| [I05 행정 안내](I05.md) | 누락·헛걸음 감소 | 규정 지식의 최신성 | 높음: 교내 범위 | 일반 FAQ와 유사 | 학교 협력 시 대안 |\n| [I06 조건형 여행](I06.md) | 이용 불가 추천 감소 | 맥락·현장 지식 | 중간 이하 | 최신 시설 정보 | 후순위 |\n| [I07 선택형 기억](I07.md) | 통제감 있는 개인화 | 고객 지식의 관리 | 중간 | 설정 부담·구매자 불명확 | I01의 기능으로 결합 |\n| [I08 AI 평가](I08.md) | 서비스 실패 사전 발견 | 실패 지식 재사용 | 개발 역량에 좌우 | 기존 벤치마크와 차이 | 기술 중심 대안 |\n\n## 권장 제출 제목\n\n**고객 확인형 인계 카드와 서비스 회복 지식 재사용이 고객 노력 및 해결 성과에 미치는 영향**\n\n서비스 이름은 ‘이어봄’ 같은 간단한 가칭을 써도 되지만, 제목에는 검증할 효과와 지식경영 요소를 넣는 편이 낫다. 신규성은 아직 확정되지 않았다.\n\n## 주제가 바뀌면\n\n- 고객 경험 중심이면 I01·I03을 우선 검토한다.\n- 조직 혁신·지식 공유 중심이면 I02·I04가 더 직접적이다.\n- Agentic AI·안전한 지식 중심이면 I01의 근거·권한·인계 검증 또는 I08이 적합하다.\n- 사업화 중심이면 실제 매장 협력과 구매자 인터뷰가 있는 I02를 우선한다.\n\n이 분기는 공지의 주제를 추정한 것이 아니라, 원문을 받은 후 선택을 조정하는 기준이다.\n", "html": "\u003ch1>후보 비교와 선택 기준\u003c/h1>\n\u003cp>\u003ca href=\"#README.md\">위키 홈\u003c/a> · \u003ca href=\"#literature.md\">논문 지도\u003c/a>\u003c/p>\n\u003cp>대회 공식 심사표를 확보하지 못했으므로 아래는 조사자의 상대적 판단이다. 시장 검증 결과나 수상 확률이 아니다. 학생 팀이 3~4주 동안 시제품과 소규모 사용자 검증을 수행한다는 가정이다.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>후보\u003c/th>\n\u003cth>고객 가치\u003c/th>\n\u003cth>학회 연결\u003c/th>\n\u003cth>학생 실행성\u003c/th>\n\u003cth>가장 큰 제약\u003c/th>\n\u003cth>판단\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ca href=\"#ideas/I01.md\">I01 상담 인계\u003c/a>\u003c/td>\n\u003ctd>반복 설명·미해결 감소\u003c/td>\n\u003ctd>고객 지식·조직 기억\u003c/td>\n\u003ctd>높음: 모의 상담 가능\u003c/td>\n\u003ctd>상용 이관 기능과 차별화\u003c/td>\n\u003ctd>종합 추천\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#ideas/I02.md\">I02 매장 노하우\u003c/a>\u003c/td>\n\u003ctd>직원별 서비스 편차 감소\u003c/td>\n\u003ctd>암묵지 전환·공유\u003c/td>\n\u003ctd>높음: 협력 매장 필요\u003c/td>\n\u003ctd>점장의 기록 참여\u003c/td>\n\u003ctd>현장 협력 가능 시 1순위\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#ideas/I03.md\">I03 시니어 지원\u003c/a>\u003c/td>\n\u003ctd>스스로 이용 완료\u003c/td>\n\u003ctd>설명 지식·디지털 신뢰\u003c/td>\n\u003ctd>중간\u003c/td>\n\u003ctd>실제 대상자 모집\u003c/td>\n\u003ctd>사회적 가치 중심 추천\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#ideas/I04.md\">I04 리뷰→개선\u003c/a>\u003c/td>\n\u003ctd>같은 불편 재발 감소\u003c/td>\n\u003ctd>고객 지식→조직 학습\u003c/td>\n\u003ctd>높음\u003c/td>\n\u003ctd>장기 개선 효과 관찰\u003c/td>\n\u003ctd>데이터 분석 중심 대안\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#ideas/I05.md\">I05 행정 안내\u003c/a>\u003c/td>\n\u003ctd>누락·헛걸음 감소\u003c/td>\n\u003ctd>규정 지식의 최신성\u003c/td>\n\u003ctd>높음: 교내 범위\u003c/td>\n\u003ctd>일반 FAQ와 유사\u003c/td>\n\u003ctd>학교 협력 시 대안\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#ideas/I06.md\">I06 조건형 여행\u003c/a>\u003c/td>\n\u003ctd>이용 불가 추천 감소\u003c/td>\n\u003ctd>맥락·현장 지식\u003c/td>\n\u003ctd>중간 이하\u003c/td>\n\u003ctd>최신 시설 정보\u003c/td>\n\u003ctd>후순위\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#ideas/I07.md\">I07 선택형 기억\u003c/a>\u003c/td>\n\u003ctd>통제감 있는 개인화\u003c/td>\n\u003ctd>고객 지식의 관리\u003c/td>\n\u003ctd>중간\u003c/td>\n\u003ctd>설정 부담·구매자 불명확\u003c/td>\n\u003ctd>I01의 기능으로 결합\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#ideas/I08.md\">I08 AI 평가\u003c/a>\u003c/td>\n\u003ctd>서비스 실패 사전 발견\u003c/td>\n\u003ctd>실패 지식 재사용\u003c/td>\n\u003ctd>개발 역량에 좌우\u003c/td>\n\u003ctd>기존 벤치마크와 차이\u003c/td>\n\u003ctd>기술 중심 대안\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>권장 제출 제목\u003c/h2>\n\u003cp>\u003cstrong>고객 확인형 인계 카드와 서비스 회복 지식 재사용이 고객 노력 및 해결 성과에 미치는 영향\u003c/strong>\u003c/p>\n\u003cp>서비스 이름은 ‘이어봄’ 같은 간단한 가칭을 써도 되지만, 제목에는 검증할 효과와 지식경영 요소를 넣는 편이 낫다. 신규성은 아직 확정되지 않았다.\u003c/p>\n\u003ch2>주제가 바뀌면\u003c/h2>\n\u003cul>\n\u003cli>고객 경험 중심이면 I01·I03을 우선 검토한다.\u003c/li>\n\u003cli>조직 혁신·지식 공유 중심이면 I02·I04가 더 직접적이다.\u003c/li>\n\u003cli>Agentic AI·안전한 지식 중심이면 I01의 근거·권한·인계 검증 또는 I08이 적합하다.\u003c/li>\n\u003cli>사업화 중심이면 실제 매장 협력과 구매자 인터뷰가 있는 I02를 우선한다.\u003c/li>\n\u003c/ul>\n\u003cp>이 분기는 공지의 주제를 추정한 것이 아니라, 원문을 받은 후 선택을 조정하는 기준이다.\u003c/p>\n"}, {"id": "literature.md", "title": "논문 지도", "text": "# 논문 지도\n\n[위키 홈](README.md) · [검색 방법과 한계](research-log.md) · [CSV 다운로드](papers.csv)\n\n국내 10편(지식경영연구 9편 포함), 해외 15편의 선별 문헌 지도다. 전수 수집이나 25편 전체 원문 정독을 뜻하지 않는다. 해외 문헌에는 arXiv 공개 연구보고서가 포함된다. 논문 카드에서 실제 확인 범위를 확인할 수 있다.\n\n먼저 읽을 순서: **P16 → P07 → P09 → P04 → P01 → P11 → P19**. 고객 문제, 현장 효과, 반례, 고객 여정, 지식경영, 협업 검증, 구현 순서다.\n\n| ID | 논문 | 연도 | 연구 방식 | 연결 |\n|---|---|---:|---|---|\n| [P01](papers/P01.md) | A Dynamic Theory of Organizational Knowledge Creation | 1994 | 이론 | I02 I04 |\n| [P02](papers/P02.md) | Review: Knowledge Management and Knowledge Management Systems: Conceptual Foundations and Research Issues | 2001 | 문헌 검토 | I01 I02 I04 |\n| [P03](papers/P03.md) | Five Styles of Customer Knowledge Management, and How Smart Companies Use Them To C
